# pgBackRest của ClinicAI — đọc kèm docs/KE-HOACH-SAO-LUU-NOI-TIEP.md.
#
# MỘT KHO, TRÊN Ổ VPS. /var/lib/pgbackrest là thư mục máy chủ gắn vào
# (SUPABASE_DB_PGBACKREST_DIR). Không đặt kho thứ hai trên Viettel CFS: với nhiều
# kho, `archive-push` báo LỖI cho Postgres khi CHỈ MỘT kho hỏng (đọc mã nguồn
# push/file.c, 03/11/2026) → WAL dồn trên ổ VPS mỗi lần CFS chập chờn. Kho này
# được chép sang CFS bằng timer riêng (scripts/may-chu/chep-kho-sao-luu.py).
[global]
repo1-path=/var/lib/pgbackrest/repo
# 4 bản đầy đủ (mỗi tuần một) ≈ 4 tuần lùi được tới từng giây; nhật ký cũ hơn
# bản đầy đủ cũ nhất bị dọn cùng nó.
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
compress-level=3
# Máy 4 nhân chạy cả prod lẫn staging — sao lưu không giành quá 2 nhân.
process-max=2
start-fast=y

# Chép WAL bất đồng bộ: Postgres không phải chờ từng tệp.
archive-async=y
spool-path=/var/lib/pgbackrest/spool
# Kho không nhận được nhật ký mà hàng chờ vượt 4 GiB → pgBackRest BỎ hàng chờ
# (mất khả năng lùi từng giây từ đó, cần bản đầy đủ mới) thay vì để pg_wal làm
# đầy ổ và Postgres dừng. Canh gác báo CHEP_NHAT_KY_* trước khi tới đó.
archive-push-queue-max=4GiB

log-path=/var/lib/pgbackrest/log
log-level-console=info
log-level-file=info

[clinicai]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
