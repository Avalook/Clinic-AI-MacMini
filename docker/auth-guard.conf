# Chặn dò mật khẩu ở cửa đăng nhập.
#
# VÌ SAO CÓ FILE NÀY, đo được ngày 12/08/2026:
#
#   15 lần đăng nhập sai liên tiếp vào staging  → 400 400 400 … không lần nào bị chặn
#   10 lần đăng nhập sai liên tiếp vào PROD     → 400 400 400 … không lần nào bị chặn
#
# Nghĩa là ai tìm được địa chỉ máy chủ đều đoán mật khẩu được không giới hạn số
# lần, với hệ thống của một phòng khám thật.
#
# VÌ SAO KHÔNG CÓ SẴN CHỖ NÀO KHÁC ĐỂ LÀM:
#   · GoTrue v2.177.0 có 9 loại giới hạn (RateLimitOtp, RateLimitEmailSent,
#     RateLimitVerify…) nhưng KHÔNG loại nào áp cho `/token?grant_type=password`.
#     Đã dò thẳng chuỗi trong binary để chắc chắn, không đoán theo tài liệu.
#   · Caddy bản gốc KHÔNG có module giới hạn (`caddy list-modules` không ra gì);
#     nó là plugin bên thứ ba, phải dựng lại image.
#   · Cổng Supabase cũng là Caddy, nên cũng không.
#
# Vì thế: một nginx nhỏ đứng riêng, CHỈ nhận đúng đường đăng nhập. Nếu nó chết,
# chỉ đăng nhập hỏng — phần còn lại của ứng dụng không đi qua đây.

# 20 lần/phút cho mỗi địa chỉ, cho phép dồn 10 lần liền.
#
# NGƯỠNG RỘNG RÃI LÀ CÓ CHỦ Ý. Cả phòng khám dùng chung MỘT địa chỉ IP (NAT),
# nên một ngưỡng chặt sẽ để một nhân viên gõ nhầm khoá luôn đồng nghiệp. Người
# thật gõ sai nhiều lắm 5–10 lần rồi dừng lại đi hỏi; máy dò thì cần hàng nghìn
# lần mới có cơ hội, và nó đâm vào tường ngay ở lần thứ 31 của phút đầu tiên.
#
# Đây không phải bức tường chống được kẻ kiên nhẫn dò chậm. Nó chặn thứ THẬT SỰ
# tồn tại ngoài kia: máy quét tự động thử hàng nghìn mật khẩu mỗi phút.
limit_req_zone $dia_chi_that zone=dangnhap:10m rate=20r/m;

# LẤY ĐÚNG ĐỊA CHỈ NGƯỜI DÙNG, KHÔNG PHẢI ĐỊA CHỈ CỦA CADDY.
#
# nginx đứng sau Caddy, nên `$remote_addr` với nó luôn là Caddy — mọi người dùng
# sẽ dùng chung MỘT xô đếm, và cả phòng khám bị khoá vì một kẻ lạ ở đâu đó. Phải
# đọc từ X-Forwarded-For do Caddy đặt.
#
# `map` chứ không dùng thẳng `$http_x_forwarded_for`: header ấy có thể có nhiều
# giá trị ("client, proxy1, proxy2") và người gửi có thể tự chèn giá trị giả vào
# đầu. Lấy phần TỬ CUỐI — phần do Caddy tự ghi thêm — là phần duy nhất không bịa
# được. Không có header thì lùi về $remote_addr.
map $http_x_forwarded_for $dia_chi_that {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

server {
    listen 80;
    # NGHE CẢ IPv6 — PHẢI TỰ VIẾT Ở ĐÂY.
    #
    # Image nginx bình thường có script khởi động tự thêm dòng này
    # (10-listen-on-ipv6-by-default.sh). Nhưng ta mount file cấu hình CHỈ-ĐỌC,
    # nên nó không sửa được và bỏ qua trong im lặng — log chỉ ghi một dòng
    # "info", không phải "error".
    #
    # Hậu quả đo được: `wget http://localhost/guard-health` bên trong container
    # bị "Connection refused", vì `localhost` phân giải sang ::1 trước. Nghĩa là
    # healthcheck của compose sẽ đỏ dù nginx hoàn toàn khoẻ.
    listen [::]:80;
    server_name _;

    # Không tiết lộ phiên bản nginx trong header lỗi.
    server_tokens off;

    location / {
        limit_req zone=dangnhap burst=10 nodelay;

        # 429 chứ không phải 503 mặc định: 429 nói đúng chuyện gì đã xảy ra, và
        # là thứ giao diện đọc được để hiện câu tử tế thay vì "máy chủ hỏng".
        limit_req_status 429;

        # Ghi lại mỗi lần chặn, để còn biết có ai đang dò hay không. Không có
        # dòng log này thì một đợt tấn công đi qua trong im lặng hoàn toàn.
        limit_req_log_level warn;

        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $dia_chi_that;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Cho compose biết nginx còn sống. Không đi qua limit_req, nếu không thì
    # chính healthcheck sẽ tự ăn hết hạn mức và báo container chết.
    location = /guard-health {
        access_log off;
        return 200 "ok\n";
    }
}
