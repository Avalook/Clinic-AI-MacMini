[project]
name = "clinicai"
version = "0.1.0"
description = "ClinicAI - Dr4women"
authors = [
    {name = "Dr4women Team"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.115.12)",
    "uvicorn[standard] (==0.34.3)",
    "pydantic (==2.11.4)",
    "pydantic-settings (==2.9.1)",
    "supabase (==2.15.2)",
    "asyncpg (==0.30.0)",
    "sqlalchemy (==2.0.41)",
    "langgraph (>=0.6.0,<0.7.0)",
    "langchain-anthropic (==0.3.14)",
    "anthropic (==0.52.0)",
    "aio-pika (==9.5.5)",
    "structlog (==25.3.0)",
    "python-dotenv (==1.1.0)",
    "langchain-core (>=0.3.0,<0.4.0)",
    "langgraph-checkpoint-postgres (>=2.0.0,<3.0.0)",
    "psycopg[binary,pool] (>=3.1.0,<4.0.0)",
    "tenacity (>=8.2.0,<10.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    # Báo lỗi. `core/sentry.py` đã gọi ở main.py:72 từ lâu nhưng thư viện chưa
    # bao giờ được cài — nên nhánh `except ImportError` là nhánh DUY NHẤT từng
    # chạy, và nó chỉ ghi một dòng log cảnh báo rồi đi tiếp. Tính năng nhìn như
    # có mà chưa từng có. Cài vào thì chỉ cần đặt SENTRY_DSN là bật, không phải
    # dựng lại image nữa.
    "sentry-sdk[fastapi] (>=2.20.0,<3.0.0)"
]


[tool.poetry]
packages = [{ include = "clinicai", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==8.3.5)",
    "pytest-asyncio (==0.26.0)",
    "pytest-cov (==6.1.0)",
    "httpx (==0.28.1)",
    "ruff (==0.11.10)",
    "mypy (==1.15.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "notion-client (>=3.1.0,<4.0.0)"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires an explicit disposable DATABASE_URL_TEST",
    "integration: calls an external service or requires external credentials",
]
