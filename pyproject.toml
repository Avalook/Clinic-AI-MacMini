[project]
name = "clinicai"
version = "0.1.0"
description = "ClinicAI - Dr4women"
authors = [
    {name = "Dr4women Team"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.115.12)",
    "uvicorn[standard] (==0.34.3)",
    "pydantic (==2.11.4)",
    "pydantic-settings (==2.9.1)",
    "supabase (==2.15.2)",
    "asyncpg (==0.30.0)",
    "sqlalchemy (==2.0.41)",
    # 24/11/2026 gỡ: langgraph + langchain-* + langgraph-checkpoint-postgres +
    # psycopg (orchestrator/graphs AI cũ, không màn nào gọi), aio-pika (RabbitMQ
    # chưa từng bật ở prod), sentry-sdk (Sentry đã chết — lỗi đi kho `loi_nhom`).
    "anthropic (==0.52.0)",
    "structlog (==25.3.0)",
    "python-dotenv (==1.1.0)",
    "tenacity (>=8.2.0,<10.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    # Xuất Excel thật (.xlsx) ở báo cáo / lịch sử thu / danh sách hoá đơn
    # (13/10/2026). Từng nằm ở nhóm dev → ảnh prod (`--only main`) không có →
    # API chết ngay lúc khởi động (deploy staging 13/10 bắt được).
    "openpyxl (>=3.1.5,<4.0.0)",
    # Đọc CHỮ trong PDF kết quả đối tác về từ Drive (05/11/2026) để ghép theo tên +
    # SĐT khách. Thuần Python, chạy trên máy chủ — không gửi nội dung đi đâu.
    "pypdf (>=5.0,<7.0)"
]


[tool.poetry]
packages = [{ include = "clinicai", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==8.3.5)",
    "pytest-asyncio (==0.26.0)",
    "pytest-cov (==6.1.0)",
    "httpx (==0.28.1)",
    "ruff (==0.11.10)",
    "mypy (==1.15.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "notion-client (>=3.1.0,<4.0.0)"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires an explicit disposable DATABASE_URL_TEST",
    "integration: calls an external service or requires external credentials",
]
