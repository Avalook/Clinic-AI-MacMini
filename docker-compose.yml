# ClinicAI / Dr4Women — self-host stack (Mac mini, Docker/Colima).
# ONE parameterized compose for BOTH environments. Select env with --env-file:
#
#   PROD    : docker compose --env-file .env.prod    -p clinicai_prod    up -d
#   STAGING : docker compose --env-file .env.staging -p clinicai_staging up -d
#
# Prod + staging run side-by-side on the same Mac: different project names (-p),
# different Caddy host ports (CADDY_HTTP_PORT/HTTPS_PORT), different Supabase.
# Application rows live in Supabase cloud; host config, volumes and platform
# identities still require the separate backup/restore plan in OPS-RUNBOOK.
#
# Ingress: Caddy (auto-HTTPS) is the ONLY service bound to public host ports.
#   api + dashboard are internal-only (reached over the compose network).
# Public access: put Caddy behind Cloudflare Tunnel (profile `cloudflare`) or
#   Tailscale Funnel (host-level, see scripts/clinic-backend-boot.sh).
#
# Runtime secrets: CLINIC_ENV_FILE must name the same explicit file passed to
#   --env-file. This prevents a staging command from loading production runtime
#   secrets from a shared `.env` file.
# Optional profiles:  --profile workers   (RabbitMQ worker + notification relay)
#                     --profile notifications (notification relay only)
#                     --profile pos       (POS outbox relay — ADR-0010)
#                     --profile cloudflare (cloudflared tunnel)

x-clinic-service-defaults: &clinic-service-defaults
  # Bound log growth protects the single host from an incident filling its SSD.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  # Prevent descendants from gaining privileges through setuid/setgid binaries.
  security_opt:
    - no-new-privileges:true
  # Reap orphaned child processes in long-running application containers.
  init: true

services:
  # ---- Reverse proxy / TLS (public ingress) --------------------------------
  caddy:
    <<: *clinic-service-defaults
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    pids_limit: 128
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in the env file}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  # ---- Frontend (Next.js standalone) — UI only -----------------------------
  dashboard:
    <<: *clinic-service-defaults
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile.dashboard
      args:
        # PUBLIC anon-tier values, inlined into the client bundle at build time.
        # Địa chỉ Supabase mà TRÌNH DUYỆT gọi — khác địa chỉ container gọi.
        #
        # Trước đây dùng thẳng ${SUPABASE_URL}, mà ở staging nó là
        # host.docker.internal:54321 — chỉ phân giải được BÊN TRONG container.
        # Nó bị nung vào bundle JS nên mọi trình duyệt (kể cả trên chính máy
        # này) không gọi nổi Supabase: realtime không cập nhật, nút Thoát không
        # ăn, quên mật khẩu hỏng. Đăng nhập vẫn chạy vì là server action — nên
        # lỗi này im lặng.
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    image: clinicai-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${DASHBOARD_MEMORY_LIMIT:-512m}
    pids_limit: 256
    env_file: ["${CLINIC_ENV_FILE:?set CLINIC_ENV_FILE to .env.prod or .env.staging}"]
    environment:
      # Dashboard calls FastAPI over the internal network (never the internet).
      CLINIC_API_URL: http://api:8000
      OPS_DOZZLE_PUBLIC_URL: ${OPS_DOZZLE_PUBLIC_URL:-http://127.0.0.1:${DOZZLE_PORT:-8888}}
      OPS_KUMA_PUBLIC_URL: ${OPS_KUMA_PUBLIC_URL:-http://127.0.0.1:${KUMA_PORT:-3001}}
      OPS_SENTRY_PUBLIC_URL: ${OPS_SENTRY_PUBLIC_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]

  # ---- Backend (FastAPI + LangGraph) — all business logic ------------------
  api:
    <<: *clinic-service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    image: clinicai-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    pids_limit: 256
    env_file: ["${CLINIC_ENV_FILE:?set CLINIC_ENV_FILE to .env.prod or .env.staging}"]
    environment:
      CHECKPOINTER_BACKEND: ${CHECKPOINTER_BACKEND:-postgres}
      OPS_STATUS_FILE: /run/clinicai-ops/status.json
    volumes:
      # The default must exist on any host, not just this Mac (ADR-0013): a
      # hard-coded /Users/... path made `up` fail or silently mount an empty
      # root-owned directory on a VPS. Point OPS_STATUS_DIR wherever the
      # collector writes; the repo-relative default works everywhere.
      - type: bind
        source: ${OPS_STATUS_DIR:-./.ops-status}/${APP_ENV:-production}
        target: /run/clinicai-ops
        read_only: true
    healthcheck:
      # Readiness, not just process liveness: deploy must roll back when the
      # backend cannot actually reach Supabase/Postgres.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]

  # ---- Async worker (opt-in: --profile workers) ----------------------------
  worker:
    <<: *clinic-service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    image: clinicai-api:${IMAGE_TAG:-latest}
    profiles: ["workers"]
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    pids_limit: 256
    env_file: ["${CLINIC_ENV_FILE:?set CLINIC_ENV_FILE to .env.prod or .env.staging}"]
    command: ["python", "-m", "clinicai.worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Consumer không có vòng poll, nên nhịp tim là "kết nối broker còn mở",
      # đánh dấu mỗi WORKER_HEARTBEAT_INTERVAL (30s). Cửa sổ 180s = 6 nhịp.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/worker-alive 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [internal]

  # POS outbox relay (ADR-0010). Opt-in only after configuring a real adapter;
  # the null adapter dead-letters instead of claiming fake delivery. Kept
  # separate from the notification relay because a POS being down
  # must not delay a patient's SMS, and vice versa.
  pos-relay:
    <<: *clinic-service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    image: clinicai-api:${IMAGE_TAG:-latest}
    profiles: ["pos"]
    restart: unless-stopped
    mem_limit: ${POS_RELAY_MEMORY_LIMIT:-256m}
    pids_limit: 128
    env_file: ["${CLINIC_ENV_FILE:?set CLINIC_ENV_FILE to .env.prod or .env.staging}"]
    environment:
      POS_ADAPTER: ${POS_ADAPTER:-none}
    command: ["python", "-m", "clinicai.worker", "--pos-relay"]
    healthcheck:
      # POS_RELAY_POLL_INTERVAL = 60s → cửa sổ 300s (5 lần).
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/worker-alive 2>/dev/null || echo 0) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [internal]

  # Lightweight notification outbox relay. It polls Supabase directly and does
  # not depend on RabbitMQ. `workers` keeps current full-stack semantics; the
  # `notifications` profile can run this service on its own.
  notification-relay:
    <<: *clinic-service-defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    image: clinicai-api:${IMAGE_TAG:-latest}
    profiles: ["workers", "notifications"]
    restart: unless-stopped
    mem_limit: ${NOTIFICATION_RELAY_MEMORY_LIMIT:-256m}
    pids_limit: 128
    env_file: ["${CLINIC_ENV_FILE:?set CLINIC_ENV_FILE to .env.prod or .env.staging}"]
    command: ["python", "-m", "clinicai.worker", "--relay"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Vòng lặp CÓ QUAY, không phải tiến trình CÒN SỐNG. `restart:
      # unless-stopped` chỉ bắt được tiến trình chết; nó không nhìn thấy vòng
      # lặp treo — kết nối không timeout, một await không bao giờ về — và đó mới
      # là kiểu hỏng thật của một relay. Container xanh, Kuma xanh, còn tin nhắn
      # thì ngừng gửi cho tới khi có người nhắn hỏi.
      #
      # Mỗi vòng poll chạm vào file nhịp tim (worker._beat). Cửa sổ 180s = 6 lần
      # RELAY_POLL_INTERVAL (30s): đủ rộng để một lần poll chậm không báo động,
      # đủ hẹp để một relay đứng hình bị phát hiện trong vài phút.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/worker-alive 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [internal]

  rabbitmq:
    <<: *clinic-service-defaults
    image: rabbitmq:3.13-management-alpine
    profiles: ["workers"]
    restart: unless-stopped
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-512m}
    pids_limit: 512
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clinicai}
      # Empty is allowed while the profile is disabled so the base stack still
      # resolves. If workers are enabled, the entrypoint and deploy preflight
      # both fail closed instead of creating a broker with a shared default.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-clinicai}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${RABBITMQ_DEFAULT_PASS:-}" ]; then
          echo "RabbitMQ password is required when the workers profile is enabled" >&2
          exit 78
        fi
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # ---- Monitoring + logs (bound to localhost → private via Tailscale) ------
  uptime-kuma:
    <<: *clinic-service-defaults
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    mem_limit: ${KUMA_MEMORY_LIMIT:-256m}
    pids_limit: 256
    ports:
      - "127.0.0.1:${KUMA_PORT:-3001}:3001"
    volumes:
      - kuma_data:/app/data
      # Cấu hình monitor bằng file, giữ trong git (xem monitoring/README.md).
      # Trước đây toàn bộ danh sách "đang giám sát cái gì" chỉ nằm trong volume
      # kuma_data: không ai đọc lại được, và mất volume là mất sạch giám sát
      # trong im lặng.
      - ./monitoring:/monitoring:ro
    healthcheck:
      # Bản thân hệ giám sát cũng phải được giám sát. Kuma chết thì mọi cảnh báo
      # ngừng gửi, và "không có cảnh báo" trông y hệt "mọi thứ đều ổn".
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [internal]

  dozzle:
    <<: *clinic-service-defaults
    image: amir20/dozzle:v10.6.9
    restart: unless-stopped
    mem_limit: ${DOZZLE_MEMORY_LIMIT:-128m}
    pids_limit: 128
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      # Basic auth for the log viewer (spec Phase 6: protected). Set in env file.
      DOZZLE_AUTH_PROVIDER: ${DOZZLE_AUTH_PROVIDER:-none}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Logs stay isolated from the clinical service network. Container actions
    # and shell remain disabled (Dozzle defaults).
    networks: [monitoring]

  # ---- Cloudflare Tunnel (opt-in: --profile cloudflare) --------------------
  cloudflared:
    <<: *clinic-service-defaults
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEMORY_LIMIT:-128m}
    pids_limit: 128
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      caddy:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  kuma_data:
  dozzle_data:
