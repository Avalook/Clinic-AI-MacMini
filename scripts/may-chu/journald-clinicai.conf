# /etc/systemd/journald.conf.d/clinicai.conf — log container giữ qua deploy
# (docker-compose.journald.yml). Xem docs/KE-HOACH-THEO-DOI-LOI.md Pha 0.
[Journal]
# Mặc định Ubuntu là "auto": KHÔNG có /var/log/journal thì journal chỉ nằm
# trong RAM (/run) — mất khi khởi động lại, trần ~10% tmpfs. Ghi hẳn xuống đĩa.
Storage=persistent
# Đĩa 48G, đang dùng ~38%. 2G log ≈ vài tuần ở ~1 lượt gọi/giây.
SystemMaxUse=2G
SystemKeepFree=5G
# Mọi container đi chung một "dịch vụ" (docker.service) trong mắt journald. Trần
# mặc định 10000 dòng / 30 giây sẽ NUỐT log đúng lúc có bão lỗi — lúc cần nhất.
RateLimitIntervalSec=30s
RateLimitBurst=50000
