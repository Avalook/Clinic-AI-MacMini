<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ code ClinicAI</title>
<!-- Khuôn của `python3 scripts/ban-do-code.py` → .ban-do/index.html. Dữ liệu nhúng ở
     #du-lieu lúc sinh. Không thư viện ngoài: mở thẳng tệp bằng trình duyệt là chạy. -->
<style>
:root {
  --nen: #f6f5f1; --mat: #ffffff; --mat-2: #efede6; --vien: #dedbd2;
  --chu: #1d1c19; --chu-nhat: #6b685f; --nhan: #0f6b5c; --nhan-nhat: #d8efe9;
  --nghe: #b5651d; --nghe-nhat: #f7e6d4; --no: #b4232c; --no-nhat: #f8dfe0;
  --vang: #9a6b00; --vang-nhat: #f6ecd2; --xam: #9b978c;
  --d-su-kien: #0f8a73; --d-ngam: #d9771b; --d-ghi: #c62f38; --d-lien: #9b978c;
  --bong: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --chu-than: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --nen: #141413; --mat: #1d1d1b; --mat-2: #262624; --vien: #34332f;
    --chu: #ecebe6; --chu-nhat: #9d9a90; --nhan: #4fc3a8; --nhan-nhat: #173a33;
    --nghe: #e3a15f; --nghe-nhat: #3a2a19; --no: #f07178; --no-nhat: #3d1f22;
    --vang: #e0b44a; --vang-nhat: #3a3016; --xam: #6f6c64;
    --d-su-kien: #39c4a6; --d-ngam: #f0a04b; --d-ghi: #f0717a; --d-lien: #6f6c64;
    --bong: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--nen); color: var(--chu); font: 14px/1.5 var(--chu-than); }
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
button { font: inherit; }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--nen) 90%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--vien); padding: 10px 16px; }
.dau { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; max-width: 1400px; margin: 0 auto; }
.dau h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.dau .luc { color: var(--chu-nhat); font-size: 12px; }
.canh-bao { font-size: 12px; color: var(--vang); background: var(--vang-nhat); border-radius: 6px; padding: 1px 8px; }
.tim { flex: 1 1 240px; position: relative; }
.tim input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--vien); border-radius: 10px;
  background: var(--mat); color: var(--chu); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
.tim input:focus { border-color: var(--nhan); box-shadow: 0 0 0 3px var(--nhan-nhat); }
.tim svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--chu-nhat); }
.chon { display: inline-flex; border: 1px solid var(--vien); border-radius: 10px; overflow: hidden; background: var(--mat); }
.chon button { border: 0; background: none; color: var(--chu-nhat); padding: 6px 10px; font-size: 13px; cursor: pointer; }
.chon button.bat { background: var(--nhan); color: #fff; }
nav.the { display: flex; gap: 4px; max-width: 1400px; margin: 8px auto 0; overflow-x: auto; }
nav.the button { border: 0; background: none; color: var(--chu-nhat); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
nav.the button:hover { background: var(--mat-2); }
nav.the button.bat { background: var(--mat); color: var(--chu); box-shadow: var(--bong); font-weight: 600; }
nav.the .dem { color: var(--chu-nhat); font-weight: 400; font-size: 12px; margin-left: 4px; }
nav.the .dem.do { color: var(--no); font-weight: 600; }

main { max-width: 1400px; margin: 0 auto; padding: 14px 16px; }
.goi-y { color: var(--chu-nhat); margin: 0 0 12px; font-size: 13px; }

/* ── Sơ đồ ── */
.thanh-so-do { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 10px; font-size: 13px; }
.lop { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--vien);
  background: var(--mat); cursor: pointer; user-select: none; transition: opacity .15s, border-color .15s; }
.lop i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.lop.tat { opacity: .45; }
.lop .so { color: var(--chu-nhat); font-size: 12px; }
.nut-nho { border: 1px solid var(--vien); background: var(--mat); color: var(--chu); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.nut-nho.bat { border-color: var(--no); color: var(--no); background: var(--no-nhat); }
.khung-so-do { position: relative; background: var(--mat); border: 1px solid var(--vien); border-radius: 14px; box-shadow: var(--bong);
  height: calc(100vh - 210px); min-height: 420px; overflow: hidden; touch-action: none; }
.khung-so-do svg { width: 100%; height: 100%; display: block; cursor: grab; }
.khung-so-do svg.keo { cursor: grabbing; }
.goc-huong-dan { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--chu-nhat); pointer-events: none; }
#nhan-day { position: absolute; pointer-events: none; background: var(--chu); color: var(--nen); font-size: 12px; padding: 3px 8px;
  border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .12s; transform: translate(-50%, -130%); }
.day { fill: none; stroke-linecap: round; transition: stroke-opacity .2s, stroke-width .15s; }
.day.su_kien { stroke: var(--d-su-kien); stroke-opacity: .55; }
.day.ngam { stroke: var(--d-ngam); stroke-opacity: .9; stroke-dasharray: 6 5; animation: chay 1.2s linear infinite; }
.day.ghi_cheo { stroke: var(--d-ghi); stroke-opacity: .7; }
.day.lien_ket { stroke: var(--d-lien); stroke-opacity: .35; stroke-dasharray: 2 4; }
.day.mo-di { stroke-opacity: .05 !important; marker-end: none; }
.day.sang { stroke-opacity: 1 !important; }
.trung-day { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
@keyframes chay { to { stroke-dashoffset: -22; } }
.nut-khoi { cursor: pointer; transition: opacity .2s; }
.nut-khoi circle.than { fill: var(--mat-2); stroke: var(--vien); stroke-width: 1.5; transition: fill .2s, stroke .2s; }
.nut-khoi circle.vien-do { fill: none; stroke: var(--no); stroke-width: 2.5; stroke-dasharray: 3 3; }
.nut-khoi:hover circle.than, .nut-khoi.chon circle.than { fill: var(--nhan-nhat); stroke: var(--nhan); }
.nut-khoi text { font: 11px var(--mono); fill: var(--chu); pointer-events: none; paint-order: stroke; stroke: var(--mat); stroke-width: 3px; }
.nut-khoi .huy { fill: var(--no); }
.nut-khoi .huy-chu { font: 600 9.5px var(--chu-than); fill: #fff; stroke: none; }
.nut-khoi.mo-di { opacity: .2; }

/* ── Thẻ, danh sách ── */
.luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.the-khoi { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 14px; cursor: pointer; text-align: left;
  color: inherit; box-shadow: var(--bong); transition: transform .18s, border-color .18s; animation: hien .35s both; }
.the-khoi:hover { transform: translateY(-2px); border-color: var(--nhan); }
.the-khoi .ma { font: 600 13px var(--mono); color: var(--nhan); }
.the-khoi .ten { margin: 4px 0 10px; font-weight: 600; }
.so-nho { display: flex; flex-wrap: wrap; gap: 6px; }
.so-nho span { font-size: 12px; color: var(--chu-nhat); background: var(--mat-2); border-radius: 6px; padding: 1px 7px; }
.so-nho span.do { background: var(--no-nhat); color: var(--no); }
@keyframes hien { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.danh-sach { display: flex; flex-direction: column; gap: 6px; }
.dong { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 9px 12px; background: var(--mat);
  border: 1px solid var(--vien); border-radius: 10px; cursor: pointer; text-align: left; color: inherit; transition: border-color .15s; }
.dong:hover { border-color: var(--nhan); }
.dong .chinh { font: 600 13px var(--mono); }
.dong .phu { color: var(--chu-nhat); }
.dong .phai { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 12px var(--mono); padding: 2px 8px; border-radius: 999px;
  background: var(--mat-2); color: var(--chu); border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: border-color .15s; }
.chip:hover { border-color: var(--nhan); }
.chip.khoi { background: var(--nhan-nhat); color: var(--nhan); }
.chip.tinh { cursor: default; }
.chip.tinh:hover { border-color: transparent; }
.chip.loc.bat { border-color: currentColor; font-weight: 600; }
.nhan { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--mat-2); color: var(--chu-nhat); white-space: nowrap; }
.nhan.do { background: var(--no-nhat); color: var(--no); }
.nhan.cam { background: var(--nghe-nhat); color: var(--nghe); }
.nhan.xanh { background: var(--nhan-nhat); color: var(--nhan); }
.nhan.vang { background: var(--vang-nhat); color: var(--vang); }
.cham { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.cham.cao { background: var(--no); } .cham.vua { background: var(--nghe); } .cham.thap { background: var(--xam); }
.van-de { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; background: var(--mat);
  border: 1px solid var(--vien); border-left: 3px solid var(--vien); border-radius: 10px; animation: hien .25s both; }
.van-de.cao { border-left-color: var(--no); } .van-de.vua { border-left-color: var(--nghe); }
.van-de .td { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.van-de .ct { color: var(--chu-nhat); font-size: 13px; grid-column: 2; }
.van-de .cuoi { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.bo-loc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.bo-loc select { border: 1px solid var(--vien); background: var(--mat); color: var(--chu); border-radius: 8px; padding: 3px 8px; font: inherit; }

.tep { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; text-decoration: none;
  border: 1px solid var(--vien); background: var(--mat); transition: border-color .15s, transform .15s; min-width: 0; }
.tep:hover { border-color: var(--nhan); transform: translateX(2px); }
.tep .ten-tep { font: 600 12.5px var(--mono); white-space: nowrap; }
.tep .thu-muc { font: 12px var(--mono); color: var(--chu-nhat); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tep .them { margin-left: auto; font-size: 12px; color: var(--chu-nhat); white-space: nowrap; }
.tep svg { flex: none; color: var(--nhan); }
.tep.nho { display: inline-flex; padding: 1px 8px; }
.cac-tep { display: flex; flex-direction: column; gap: 4px; }
.tep-hang { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tep-hang > a.tep { flex: 1 1 auto; }
.tep-hang > a.tep.nho { flex: 0 1 auto; }
.nut-hieu { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--vien); background: var(--mat);
  color: var(--nhan); font: 600 12px var(--chu-than); cursor: pointer; transition: background .15s, border-color .15s; }
.nut-hieu:hover { background: var(--nhan-nhat); border-color: var(--nhan); }
.the-tep { display: flex; flex-direction: column; gap: 2px; }
.the-tep .lam-gi { margin: 0 0 4px 10px; color: var(--chu-nhat); font-size: 12.5px; }
.the-hieu { background: var(--nhan-nhat); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.the-hieu p { margin: 0 0 6px; }
.the-hieu p:last-child { margin-bottom: 0; }
.luong, .luu-y { margin: 6px 0 0; padding-left: 20px; }
.luong li, .luu-y li { margin: 2px 0; }
.dong-luat { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; padding: 7px 10px; border: 1px solid var(--vien);
  border-radius: 8px; background: var(--mat); margin-bottom: 5px; font-size: 13px; }
.dong-luat > div { flex: 1 1 240px; min-width: 0; }
.them-nua summary { cursor: pointer; color: var(--nhan); font-size: 13px; margin: 4px 0 8px; }
.canh-bao-the { background: var(--vang-nhat); color: var(--vang); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
td.nghia { color: var(--chu-nhat); font-size: 12.5px; }
.tong-quan { max-width: 920px; }
.tong-quan > h2 { font-size: 20px; margin: 4px 0 8px; letter-spacing: -.01em; }
.tong-quan > p { margin: 0 0 8px; }
ol.chang { list-style: none; padding: 0; margin: 14px 0; position: relative; }
ol.chang::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--vien); }
ol.chang li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 8px 0; animation: hien .35s both; position: relative; }
ol.chang h3 { margin: 4px 0 2px; font-size: 15px; }
ol.chang p { margin: 0 0 6px; color: var(--chu-nhat); }
.so-chang { width: 32px; height: 32px; border-radius: 50%; background: var(--nhan); color: #fff; display: grid; place-items: center; font-weight: 600; z-index: 1; }

table.bang { width: 100%; border-collapse: collapse; background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; overflow: hidden; }
table.bang td, table.bang th { padding: 6px 10px; border-bottom: 1px solid var(--vien); vertical-align: top; text-align: left; font-size: 13px; }
table.bang th { color: var(--chu-nhat); font-weight: 500; font-size: 12px; }
table.bang tr:last-child td { border-bottom: 0; }
table.bang tr.bam { cursor: pointer; transition: background .12s; }
table.bang tr.bam:hover { background: var(--mat-2); }

/* ── Khung chi tiết ── */
#man-che { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
#man-che.mo { opacity: 1; pointer-events: auto; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--nen); z-index: 10;
  border-left: 1px solid var(--vien); box-shadow: -8px 0 32px rgba(0,0,0,.12); transform: translateX(102%);
  transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
aside.mo { transform: none; }
.thanh-khung { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--vien); }
.thanh-khung .gian { flex: 1; }
.than-khung { overflow-y: auto; padding: 16px; }
.than-khung h2 { margin: 0 0 2px; font-size: 18px; }
.than-khung .ma-lon { font: 600 13px var(--mono); color: var(--nhan); }
.muc { margin-top: 16px; animation: hien .3s both; }
.muc h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--chu-nhat); margin: 0 0 8px; }
.muc .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.muc-con { border: 1px solid var(--vien); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--mat); }
.muc-con .dau-con { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; margin-bottom: 4px; }
.mui { color: var(--chu-nhat); }
.trong { color: var(--chu-nhat); font-style: italic; font-size: 13px; }
.loe { animation: loe 1s ease-out; }
@keyframes loe { 0% { box-shadow: 0 0 0 0 var(--nhan); } 100% { box-shadow: 0 0 0 14px transparent; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 640px) { .dau h1 { font-size: 15px; } .khung-so-do { height: 70vh; }
  table.ds-bang th:nth-child(n+4), table.ds-bang td:nth-child(n+4) { display: none; } }
</style>
</head>
<body>
<header>
  <div class="dau">
    <h1>Bản đồ code ClinicAI</h1>
    <span class="luc" id="luc"></span>
    <span class="canh-bao" id="canh-bao" hidden></span>
    <div class="tim">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="o-tim" type="search" placeholder="Tìm khối, màn, bảng, tệp, sự kiện… (phím /)" autocomplete="off">
    </div>
    <div class="chon" role="group" aria-label="Mở tệp bằng">
      <button data-mo="vscode">VS Code</button>
      <button data-mo="antigravity">Antigravity</button>
    </div>
  </div>
  <nav class="the" id="the"></nav>
</header>
<main id="noi-dung"></main>
<div id="man-che"></div>
<aside id="khung" aria-hidden="true">
  <div class="thanh-khung">
    <button class="nut-nho" id="nut-lui" title="Quay lại">← Lại</button>
    <span class="gian"></span>
    <button class="nut-nho" id="nut-dong" title="Đóng (Esc)">Đóng ✕</button>
  </div>
  <div class="than-khung" id="than-khung"></div>
</aside>

<script type="application/json" id="du-lieu">/*__DU_LIEU__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("du-lieu").textContent);
const KHOI = Object.fromEntries(D.khoi.map(k => [k.ma, k]));
const MAN = Object.fromEntries(D.man.map(m => [m.route, m]));
const PHAT_BOI = {};
for (const k of D.khoi) for (const p of k.phat) PHAT_BOI[p.ev] = k.ma;
const DAY = D.day || [];
const VAN_DE = D.van_de || [];
const BANG = D.bang_ct || {};
const VD_CUA = {};
for (const v of VAN_DE) (VD_CUA[v.khoi] = VD_CUA[v.khoi] || []).push(v);
// Lớp "hiểu": ghi chú từng tệp + nghĩa bảng + thẻ khối + tổng quan (đọc kỹ 21/10).
const GHI = D.ghi_chu || {};
const BANG_HIEU = D.bang_hieu || {};
const THE_KHOI = D.the_khoi || {};
const TQ = D.tong_quan;
const TEP_CUA_KHOI = {};
for (const [t, g] of Object.entries(GHI)) if (g.khoi) (TEP_CUA_KHOI[g.khoi] = TEP_CUA_KHOI[g.khoi] || []).push(t);

const LOAI_DAY = {
  su_kien: { ten: "Sự kiện", mo_ta: "khối phát → khối nghe (đúng event-driven)", mau: "var(--d-su-kien)" },
  ngam: { ten: "Dây ngầm trigger", mo_ta: "trigger trên bảng khối này tự ghi bảng khối kia", mau: "var(--d-ngam)" },
  ghi_cheo: { ten: "Ghi chéo trong code", mo_ta: "tệp khối này tự ghi bảng khối kia (chưa lego)", mau: "var(--d-ghi)" },
  lien_ket: { ten: "Liên kết bảng", mo_ta: "khoá ngoại giữa bảng hai khối", mau: "var(--d-lien)" },
};
const LOAI_VD = {
  chua_lego: ["Chưa lego", "do"], chua_su_kien: ["Chưa phát sự kiện", "cam"], khong_vet: ["Sửa không để vết", "cam"],
  logic_sql: ["Logic trong SQL", "vang"], day_ngam: ["Dây ngầm trigger", "vang"], ham_chet: ["Hàm/view chết", ""],
  bang_chua_chu: ["Bảng chưa có chủ", ""], quyen: ["Quyền", "do"],
  luat_tsx: ["Giao diện tự quyết", "cam"], comment_cu: ["Comment cũ", ""],
  phat_hien_dung: ["Đã kiểm: có thật", "do"], phat_hien_can_soat: ["Đã kiểm: cần soát tiếp", "vang"],
  phat_hien_sai: ["Đã kiểm: báo oan", ""],
};
const MUC = { cao: "Cao", vua: "Vừa", thap: "Thấp" };

const LUU = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const DOC = (k, md) => { try { return localStorage.getItem(k) || md; } catch (_) { return md; } };
// Kiểu link đọc từ Info.plist của app trên máy (21/10): vscode, antigravity-ide.
const KIEU_LINK = { vscode: "vscode", antigravity: "antigravity-ide" };
let trinhMo = DOC("ban-do-mo", "vscode");
let theDangXem = DOC("ban-do-the-v3", "tong-quan");
let tuKhoa = "";
const lichSu = [];
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── Sơ đồ lego: lực kéo + 4 lớp dây ─────────────────────────────────────────
let lopBat = JSON.parse(DOC("ban-do-lop", '{"su_kien":true,"ngam":true,"ghi_cheo":true,"lien_ket":false}'));
let chiVanDe = DOC("ban-do-chi-vd", "0") === "1";
let anJourney = DOC("ban-do-an-journey", "1") === "1";
let SD = null; // trạng thái sơ đồ: nút, dây, khung nhìn
function veSoDo() {
  const dem = t => DAY.filter(d => d.loai === t).length;
  return `<div class="thanh-so-do">` +
    Object.entries(LOAI_DAY).map(([t, x]) => `<span class="lop${lopBat[t] ? "" : " tat"}" data-lop="${t}" title="${e(x.mo_ta)}">` +
      `<i style="background:${x.mau}"></i>${x.ten} <span class="so">${dem(t)}</span></span>`).join("") +
    `<button class="nut-nho${chiVanDe ? " bat" : ""}" id="chi-vd" title="Chỉ hiện dây và khối có vấn đề">● Chỉ vấn đề</button>` +
    `<label class="lop" title="journey nghe gần hết sự kiện"><input type="checkbox" id="an-journey" ${anJourney ? "checked" : ""}> ẩn <code>journey</code></label>` +
    `<button class="nut-nho" id="xep-lai">Xếp lại</button></div>` +
    `<div class="khung-so-do" id="khung-so-do"><svg id="so-do"><defs>${Object.entries(LOAI_DAY).map(([t, x]) =>
      `<marker id="mui-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${x.mau}"/></marker>`).join("")}</defs>` +
    `<g id="zoom"><g id="lop-day"></g><g id="lop-nut"></g></g></svg><div id="nhan-day"></div>` +
    `<div class="goc-huong-dan">Kéo nền để đi · lăn chuột để phóng · kéo khối để xếp · bấm dây / khối để xem</div></div>`;
}
function dungSoDo() {
  const svg = document.getElementById("so-do");
  const W = svg.clientWidth, H = svg.clientHeight;
  const khoi = D.khoi.filter(k => !(anJourney && k.ma === "journey"));
  const coVD = new Set(Object.keys(VD_CUA).filter(m => VD_CUA[m].some(v => v.muc !== "thap")));
  const day = DAY.filter(d => lopBat[d.loai] && KHOI[d.tu] && KHOI[d.den] && !(anJourney && (d.tu === "journey" || d.den === "journey")) &&
    (!chiVanDe || d.loai === "ghi_cheo" || d.loai === "ngam"));
  const can = new Set(day.flatMap(d => [d.tu, d.den]));
  const nut = khoi.filter(k => !chiVanDe || can.has(k.ma) || coVD.has(k.ma));
  const cu = SD ? Object.fromEntries(SD.nut.map(n => [n.ma, n])) : {};
  const N = nut.map((k, i) => {
    const g = (i / nut.length) * Math.PI * 2;
    const c = cu[k.ma];
    return { ma: k.ma, x: c ? c.x : W / 2 + Math.cos(g) * W * .32, y: c ? c.y : H / 2 + Math.sin(g) * H * .32, vx: 0, vy: 0,
      r: 9 + Math.min(k.tep.length, 9) * 1.5, vd: (VD_CUA[k.ma] || []).filter(v => v.muc !== "thap").length, co: false };
  });
  const theoMa = Object.fromEntries(N.map(n => [n.ma, n]));
  const E = day.filter(d => theoMa[d.tu] && theoMa[d.den]).map(d => ({ ...d, a: theoMa[d.tu], b: theoMa[d.den] }));
  const zoom = SD ? SD.zoom : { x: 0, y: 0, k: 1 };
  SD = { nut: N, day: E, W, H, zoom, alpha: 1, chon: null };
  // dây: đường nhìn + đường bấm rộng
  const thuTu = { su_kien: 0, ngam: 1, ghi_cheo: 2, lien_ket: 3 };
  document.getElementById("lop-day").innerHTML = E.map((d, i) =>
    `<path class="day ${d.loai}" id="d${i}" stroke-width="${Math.min(1.2 + d.muc.length * .45, 5)}" marker-end="url(#mui-${d.loai})"/>` +
    `<path class="trung-day" data-day="${i}" id="t${i}"/>`).join("");
  document.getElementById("lop-nut").innerHTML = N.map(n =>
    `<g class="nut-khoi" data-khoi="${e(n.ma)}" id="n-${e(n.ma)}"><circle class="than" r="${n.r}"/>` +
    (n.vd ? `<circle class="vien-do" r="${n.r + 4}"/><circle class="huy" r="7.5" cx="${n.r * .75}" cy="${-n.r * .75}"/>` +
      `<text class="huy-chu" x="${n.r * .75}" y="${-n.r * .75 + 3.3}" text-anchor="middle">${n.vd > 99 ? "99+" : n.vd}</text>` : "") +
    `<text y="${n.r + 13}" text-anchor="middle">${e(n.ma)}</text><title>${e(KHOI[n.ma].ten)}${n.vd ? ` — ${n.vd} vấn đề` : ""}</title></g>`).join("");
  E.forEach(d => { d.lech = (thuTu[d.loai] - 1.5) * 0.12 + (E.some(x => x.a === d.b && x.b === d.a && x.loai === d.loai) ? 0.1 : 0); });
  chay();
}
function buoc() {
  const { nut: N, day: E, W, H } = SD;
  const a = SD.alpha;
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const p = N[i], q = N[j];
    let dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy || 1;
    const f = 2800 * a / d2, d = Math.sqrt(d2);
    dx /= d; dy /= d;
    p.vx -= dx * f; p.vy -= dy * f; q.vx += dx * f; q.vy += dy * f;
  }
  for (const d of E) {
    const p = d.a, q = d.b;
    const dx = q.x - p.x, dy = q.y - p.y, l = Math.sqrt(dx * dx + dy * dy) || 1;
    const muon = d.loai === "lien_ket" ? 160 : 110;
    const f = (l - muon) * 0.012 * a * (1 + Math.min(d.muc.length, 4) / 4);
    p.vx += dx / l * f; p.vy += dy / l * f; q.vx -= dx / l * f; q.vy -= dy / l * f;
  }
  for (const n of N) {
    n.vx += (W / 2 - n.x) * 0.006 * a; n.vy += (H / 2 - n.y) * 0.009 * a;
    if (!n.co) { n.x += n.vx; n.y += n.vy; }
    n.vx *= 0.6; n.vy *= 0.6;
  }
  SD.alpha *= 0.985;
}
function veViTri() {
  const { nut: N, day: E, zoom } = SD;
  document.getElementById("zoom").setAttribute("transform", `translate(${zoom.x},${zoom.y}) scale(${zoom.k})`);
  for (const n of N) document.getElementById("n-" + n.ma).setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
  E.forEach((d, i) => {
    const p = d.a, q = d.b, dx = q.x - p.x, dy = q.y - p.y, l = Math.sqrt(dx * dx + dy * dy) || 1;
    const sx = p.x + dx / l * (p.r + 3), sy = p.y + dy / l * (p.r + 3), ex = q.x - dx / l * (q.r + 7), ey = q.y - dy / l * (q.r + 7);
    const cx = (sx + ex) / 2 - dy * d.lech, cy = (sy + ey) / 2 + dx * d.lech;
    const dd = `M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
    document.getElementById("d" + i).setAttribute("d", dd);
    document.getElementById("t" + i).setAttribute("d", dd);
  });
}
let dangChay = 0;
function chay() {
  cancelAnimationFrame(dangChay);
  const giam = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (giam) { for (let i = 0; i < 400; i++) buoc(); veViTri(); return; }
  const khung = () => { buoc(); veViTri(); if (SD.alpha > 0.02) dangChay = requestAnimationFrame(khung); };
  dangChay = requestAnimationFrame(khung);
}
function sangSoDo(ma, chiSoDay) {
  if (!SD || !document.getElementById("so-do")) return;
  const lq = new Set();
  SD.day.forEach((d, i) => {
    const dinh = chiSoDay != null ? i === chiSoDay : (ma && (d.tu === ma || d.den === ma));
    const el = document.getElementById("d" + i);
    el.classList.toggle("sang", !!dinh);
    el.classList.toggle("mo-di", (ma != null || chiSoDay != null) && !dinh);
    if (dinh) { lq.add(d.tu); lq.add(d.den); }
  });
  if (ma) lq.add(ma);
  for (const n of SD.nut) {
    const g = document.getElementById("n-" + n.ma);
    g.classList.toggle("mo-di", (ma != null || chiSoDay != null) && !lq.has(n.ma));
    g.classList.toggle("chon", n.ma === ma);
  }
}
function ganSoDo() {
  const svg = document.getElementById("so-do"), nhan = document.getElementById("nhan-day");
  let keo = null;
  const diem = ev => { const r = svg.getBoundingClientRect(), z = SD.zoom; return { x: (ev.clientX - r.left - z.x) / z.k, y: (ev.clientY - r.top - z.y) / z.k }; };
  svg.addEventListener("pointerdown", ev => {
    const g = ev.target.closest(".nut-khoi");
    if (g) { const n = SD.nut.find(x => x.ma === g.dataset.khoi); keo = { loai: "nut", n, x0: ev.clientX, y0: ev.clientY, di: false }; }
    else if (!ev.target.closest(".trung-day")) { keo = { loai: "nen", x0: ev.clientX, y0: ev.clientY, zx: SD.zoom.x, zy: SD.zoom.y }; svg.classList.add("keo"); }
    if (keo) svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", ev => {
    if (!keo) {
      const t = ev.target.closest(".trung-day");
      if (t) { const d = SD.day[+t.dataset.day]; const r = svg.parentElement.getBoundingClientRect();
        nhan.style.left = (ev.clientX - r.left) + "px"; nhan.style.top = (ev.clientY - r.top) + "px";
        nhan.textContent = `${LOAI_DAY[d.loai].ten}: ${d.tu} → ${d.den} (${d.muc.length})`; nhan.style.opacity = 1;
        if (!document.getElementById("khung").classList.contains("mo")) sangSoDo(null, +t.dataset.day); }
      else nhan.style.opacity = 0;
      return;
    }
    if (keo.loai === "nut") {
      if (Math.abs(ev.clientX - keo.x0) + Math.abs(ev.clientY - keo.y0) > 4) keo.di = true;
      if (keo.di) { const p = diem(ev); keo.n.x = p.x; keo.n.y = p.y; keo.n.co = true; veViTri(); }
    } else {
      SD.zoom.x = keo.zx + ev.clientX - keo.x0; SD.zoom.y = keo.zy + ev.clientY - keo.y0; veViTri();
    }
  });
  svg.addEventListener("pointerup", ev => {
    if (keo && keo.loai === "nut" && !keo.di) mo("khoi", keo.n.ma);
    if (keo && keo.loai === "nut" && keo.di) { keo.n.co = false; SD.alpha = Math.max(SD.alpha, .25); chay(); }
    keo = null; svg.classList.remove("keo");
  });
  svg.addEventListener("pointerleave", () => { nhan.style.opacity = 0; if (!document.getElementById("khung").classList.contains("mo")) sangSoDo(null); });
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect(), z = SD.zoom, k2 = Math.min(3, Math.max(0.3, z.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    z.x = mx - (mx - z.x) * k2 / z.k; z.y = my - (my - z.y) * k2 / z.k; z.k = k2; veViTri();
  }, { passive: false });
  svg.addEventListener("mouseover", ev => {
    const g = ev.target.closest(".nut-khoi");
    if (g && !keo && !document.getElementById("khung").classList.contains("mo")) sangSoDo(g.dataset.khoi);
  });
}

// ── Tìm ─────────────────────────────────────────────────────────────────────
function veTim(q) {
  const t = q.toLowerCase(), co = s => String(s).toLowerCase().includes(t);
  const khoi = D.khoi.filter(k => co(k.ma) || co(k.ten));
  const man = D.man.filter(m => co(m.route) || co(m.tieu_de));
  const bang = Object.keys(BANG).length ? Object.keys(BANG).filter(co) : Object.keys(D.bang).filter(co);
  const tep = [];
  for (const k of D.khoi) for (const f of k.tep) if (co(f)) tep.push([f, k.ma]);
  for (const m of D.man) for (const f of [m.trang, ...m.thanh_phan, ...m.api]) if (f && co(f) && !tep.some(x => x[0] === f)) tep.push([f, m.route]);
  const suKien = Object.keys(PHAT_BOI).filter(co);
  const vd = VAN_DE.filter(v => co(v.tieu_de) || co(v.tep || ""));
  // Tìm trong nội dung ghi chú: "làm gì", luật, muốn sửa — gõ "giảm giá" ra đúng tệp.
  const ghi = Object.entries(GHI).filter(([f, g]) => !tep.some(x => x[0] === f) &&
    (co(g.lam_gi || "") || (g.luat || []).some(x => co(x.noi_dung)) || (g.muon_sua || []).some(x => co(x.viec))));
  const nhom = (ten, ds, f) => ds.length ? muc(`${ten} (${ds.length})`, `<div class="danh-sach">${ds.slice(0, 30).map(f).join("")}</div>`) : "";
  return (nhom("Khối", khoi, k => `<button class="dong" data-khoi="${e(k.ma)}"><span class="chinh">${e(k.ma)}</span><span class="phu">${e(k.ten)}</span></button>`) +
    nhom("Màn", man, m => `<button class="dong" data-man="${e(m.route)}"><span class="chinh">${e(m.route)}</span><span class="phu">${e(m.tieu_de)}</span></button>`) +
    nhom("Bảng", bang, b => `<button class="dong" data-bang="${e(b)}"><span class="chinh">${e(b)}</span><span class="phu">${e(BANG[b] ? BANG[b].khoi || "" : D.bang[b])}</span></button>`) +
    nhom("Sự kiện", suKien, ev => `<button class="dong" data-khoi="${e(PHAT_BOI[ev])}"><span class="chinh">${e(ev)}</span><span class="phu">khối ${e(PHAT_BOI[ev])} phát</span></button>`) +
    nhom("Tệp (bấm mở ngay)", tep, ([f, o]) => GHI[f] ? theTep(f) : nutTep(f, 0, o)) +
    nhom("Ghi chú nhắc tới", ghi, ([f]) => theTep(f)) +
    (vd.length ? muc(`Vấn đề (${vd.length})`, veVanDe(vd, false)) : "")) || `<p class="trong">Không thấy gì khớp “${e(q)}”.</p>`;
}

function veNoiDung() {

    ban("ghi_bang", "Ghi bảng") + ban("doc_bang", "Đọc bảng") + ban("su_kien_phat", "Phát sự kiện") + ban("su_kien_nghe", "Nghe sự kiện") + ban("goi_api", "Gọi API") +

// ── Tổng quan ───────────────────────────────────────────────────────────────

function chiTietMan(m) {

function mo(loai, ma, ghi = true) {
  let html;
  if (loai === "khoi") html = KHOI[ma] && chiTietKhoi(KHOI[ma]);
  else if (loai === "man") html = MAN[ma] && chiTietMan(MAN[ma]);
  else if (loai === "bang") html = chiTietBang(ma);
  else if (loai === "tep") html = chiTietTep(ma);
  else if (loai === "day") { const [l, a, b] = ma.split("|"); const d = DAY.find(x => x.loai === l && x.tu === a && x.den === b); html = d && chiTietDay(d); }
  if (!html) return;
  if (ghi) lichSu.push([loai, ma]);
  const than = document.getElementById("than-khung");
  than.innerHTML = html; than.scrollTop = 0; than.firstElementChild.classList.add("loe");
  document.getElementById("khung").classList.add("mo");
  document.getElementById("khung").setAttribute("aria-hidden", "false");
  document.getElementById("man-che").classList.add("mo");
  document.getElementById("nut-lui").disabled = lichSu.length < 2;
  if (loai === "khoi") sangSoDo(ma);
  if (loai === "day" && SD) { const [l, a, b] = ma.split("|"); const i = SD.day.findIndex(x => x.loai === l && x.tu === a && x.den === b); if (i >= 0) sangSoDo(null, i); }
}
function dong() {
  lichSu.length = 0;
  document.getElementById("khung").classList.remove("mo");
  document.getElementById("khung").setAttribute("aria-hidden", "true");
  document.getElementById("man-che").classList.remove("mo");
  sangSoDo(null);
}

// ── Bấm ─────────────────────────────────────────────────────────────────────
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tep],[data-khoi],[data-man],[data-bang],[data-the],[data-mo],[data-lop],[data-day],[data-day-key],[data-loc-loai],#chi-vd,#xep-lai");
  if (!t) return;
  if (t.dataset.tep) { mo("tep", t.dataset.tep); return; }
  if (t.closest("#so-do") && t.dataset.khoi) return; // khối trên sơ đồ mở bằng pointerup (phân biệt kéo / bấm)
  if (t.dataset.the) { theDangXem = t.dataset.the; LUU("ban-do-the-v3", theDangXem); tuKhoa = ""; document.getElementById("o-tim").value = ""; veNoiDung(); return; }
  if (t.dataset.mo) { trinhMo = t.dataset.mo; LUU("ban-do-mo", trinhMo); veChon(); if (theDangXem !== "so-do") veNoiDung(); if (lichSu.length) mo(...lichSu[lichSu.length - 1], false); return; }
  if (t.dataset.lop) { lopBat[t.dataset.lop] = !lopBat[t.dataset.lop]; LUU("ban-do-lop", JSON.stringify(lopBat)); veNoiDung(); return; }
  if (t.id === "chi-vd") { chiVanDe = !chiVanDe; LUU("ban-do-chi-vd", chiVanDe ? "1" : "0"); veNoiDung(); return; }
  if (t.id === "xep-lai") { SD = null; veNoiDung(); return; }
  if (t.dataset.locLoai != null) { locVD.loai = t.dataset.locLoai; LUU("ban-do-vd-loai", locVD.loai); veNoiDung(); return; }
  if (t.dataset.day != null) { const d = SD.day[+t.dataset.day]; mo("day", `${d.loai}|${d.tu}|${d.den}`); return; }
  if (t.dataset.dayKey) { mo("day", t.dataset.dayKey); return; }
  if (t.dataset.bang) { mo("bang", t.dataset.bang); return; }
  if (t.dataset.khoi) { mo("khoi", t.dataset.khoi); return; }
  if (t.dataset.man) mo("man", t.dataset.man);
});
document.addEventListener("change", ev => {
  if (ev.target.id === "an-journey") { anJourney = ev.target.checked; LUU("ban-do-an-journey", anJourney ? "1" : "0"); veNoiDung(); }
  if (ev.target.id === "loc-muc") { locVD.muc = ev.target.value; LUU("ban-do-vd-muc", locVD.muc); veNoiDung(); }
  if (ev.target.id === "loc-khoi") { locVD.khoi = ev.target.value; veNoiDung(); }
});
document.getElementById("nut-dong").onclick = dong;
document.getElementById("man-che").onclick = dong;
