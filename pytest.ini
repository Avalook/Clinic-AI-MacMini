[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = src/tests
pythonpath = src
markers =
    db: test requires a live Postgres (set DATABASE_URL_TEST). Run with -m db; skip with -m "not db".
    integration: test calls an external service or requires external credentials.
filterwarnings =
    ignore::DeprecationWarning:langgraph.*
    ignore::PendingDeprecationWarning
