<title>Bản đồ lego ClinicAI</title>
<meta name="description" content="Bản đồ lego toàn hệ thống ClinicAI: khối nghiệp vụ, hạ tầng, chuỗi sự kiện, thời gian từng bước và đề xuất sửa.">
<style>
:root {
  --nen: #f6f7f9; --mat: #ffffff; --mat2: #eef1f5; --chu: #1c2430; --chu2: #556070; --vien: #d5dbe3;
  --nv: #2f5fd0; --nv-nhat: #e3ebfb; --ht: #6b4fb8; --ht-nhat: #ece6f8; --cam: #e8730c; --cam-nhat: #fff0e2;
  --do: #d33a2c; --vang: #c98a00; --xanh: #1e9a55; --day: #9aa6b5; --bong: 0 1px 2px rgba(20,30,50,.08), 0 2px 8px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nen: #12161c; --mat: #1b2129; --mat2: #232b35; --chu: #e6ebf2; --chu2: #a3aebd; --vien: #333d4a;
    --nv: #7aa2ff; --nv-nhat: #1f2c47; --ht: #b39cf0; --ht-nhat: #2b2442; --cam: #ff9a3d; --cam-nhat: #3a2814;
    --do: #ff6b5e; --vang: #f0b429; --xanh: #45c27f; --day: #5d6878; --bong: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --nen: #12161c; --mat: #1b2129; --mat2: #232b35; --chu: #e6ebf2; --chu2: #a3aebd; --vien: #333d4a;
  --nv: #7aa2ff; --nv-nhat: #1f2c47; --ht: #b39cf0; --ht-nhat: #2b2442; --cam: #ff9a3d; --cam-nhat: #3a2814;
  --do: #ff6b5e; --vang: #f0b429; --xanh: #45c27f; --day: #5d6878; --bong: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--nen); color: var(--chu); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; }
code, .ma { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
a { color: var(--nv); }
button { font: inherit; color: inherit; }
.khung { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.dau { background: var(--mat); border-bottom: 1px solid var(--vien); position: sticky; top: 0; z-index: 20; }
.dau-trong { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; }
.dau h1 { font-size: 18px; margin: 0; white-space: nowrap; }
.dau .phu { color: var(--chu2); font-size: 14px; }
.che-do { display: flex; gap: 4px; flex-wrap: wrap; }
.che-do button { border: 1px solid var(--vien); background: var(--mat2); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.che-do button[aria-pressed="true"] { background: var(--chu); color: var(--mat); border-color: var(--chu); }
.cong-cu { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.cong-cu label { font-size: 14px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.nut-nho { border: 1px solid var(--vien); background: var(--mat); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 14px; }
.tim { position: relative; flex: 1 1 260px; max-width: 420px; }
.tim input { width: 100%; padding: 7px 10px; border: 1px solid var(--vien); border-radius: 8px; background: var(--mat); color: var(--chu); font-size: 15px; }
.ket-qua-tim { position: absolute; top: 100%; left: 0; right: 0; background: var(--mat); border: 1px solid var(--vien); border-radius: 8px; box-shadow: var(--bong); max-height: 60vh; overflow: auto; z-index: 30; display: none; }
.ket-qua-tim.mo { display: block; }
.ket-qua-tim button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--vien); font-size: 14px; }
.ket-qua-tim button:hover, .ket-qua-tim button:focus { background: var(--mat2); }
.ket-qua-tim .loai { color: var(--chu2); font-size: 14px; margin-right: 6px; }
main { padding: 14px 0 60px; }
.gioi-thieu { color: var(--chu2); margin: 4px 0 12px; }
.chu-giai { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--chu2); margin: 8px 0 14px; align-items: center; }
.chu-giai svg { vertical-align: middle; }
.cham { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.cham.do { background: var(--do); } .cham.vang { background: var(--vang); } .cham.xanh { background: var(--xanh); }
.the-tt { display: inline-block; font-size: 14px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--vien); white-space: nowrap; }
.the-tt.do-that { border-color: var(--xanh); color: var(--xanh); }
.the-tt.uoc { border-style: dashed; color: var(--chu2); }
.the-tt.moi { border-color: var(--cam); color: var(--cam); }
/* Thao tác */
.thao-tac { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
.thao-tac h2 { font-size: 15px; margin: 0 0 6px; }
.hang-chip { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--vien); background: var(--mat2); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.chip:hover { border-color: var(--cam); }
.chip[aria-pressed="true"] { background: var(--cam); color: #fff; border-color: var(--cam); }
.chip .cham { width: 9px; height: 9px; }
details.nhom { margin-top: 8px; border-top: 1px solid var(--vien); padding-top: 6px; }
details.nhom summary { cursor: pointer; font-size: 14px; color: var(--chu2); }
.nhom-khoi { margin: 8px 0; }
.nhom-khoi h3 { font-size: 14px; margin: 0 0 4px; color: var(--chu2); font-weight: 600; }
/* Bàn lego */
.ban { position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 30px; padding: 22px 18px 18px; background: var(--mat); border: 1px solid var(--vien); border-radius: 14px; }
.ban svg.day-noi { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.lego { position: relative; z-index: 1; border-radius: 10px; padding: 16px 12px 10px; min-height: 104px; cursor: pointer; border: 2px solid transparent; background: var(--nv-nhat); transition: opacity .2s, border-color .2s, background .2s; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.lego::before { content: ""; position: absolute; top: -9px; left: 14px; width: 54px; height: 10px; background: radial-gradient(circle at 9px 5px, var(--nv) 6px, transparent 6.5px) 0 0 / 22px 10px repeat-x; opacity: .85; }
.lego.ht { background: var(--ht-nhat); }
.lego.ht::before { background-image: radial-gradient(circle at 9px 5px, var(--ht) 6px, transparent 6.5px); }
.lego .ten { font-weight: 700; font-size: 15px; line-height: 1.3; }
.lego .mo-ta { font-size: 14px; color: var(--chu2); line-height: 1.35; }
.lego .so { font-size: 14px; color: var(--chu2); margin: 0; padding-left: 16px; }
.lego .dem { font-size: 14px; color: var(--chu2); margin-top: auto; }
.lego .huy-hieu { position: absolute; top: -10px; right: -8px; background: var(--cam); color: #fff; border-radius: 999px; font-size: 14px; min-width: 24px; height: 24px; padding: 0 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: var(--bong); }
.ban.co-chon .lego { opacity: .32; }
.ban.co-chon .lego.sang { opacity: 1; border-color: var(--cam); background: var(--cam-nhat); }
.ban.co-chon .lego.chinh { box-shadow: 0 0 0 3px var(--cam); }
.lego.chi { outline: 3px solid var(--cam); outline-offset: 2px; }
.lego:focus-visible { outline: 3px solid var(--nv); outline-offset: 2px; }
.nhan-hang { grid-column: 1 / -1; font-size: 14px; color: var(--chu2); margin: -18px 0 -22px; font-weight: 600; }
/* Bước */
.buoc-khung { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; margin-top: 16px; }
.buoc-khung.khong-de-xuat { grid-template-columns: minmax(0, 1fr); }
.the { min-width: 0; overflow-wrap: anywhere; background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 14px 16px; }
.the h2 { font-size: 17px; margin: 0 0 6px; }
.the h3 { font-size: 15px; margin: 14px 0 6px; }
.thong-tin { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 14px; margin: 8px 0; }
.thong-tin dt { color: var(--chu2); }
.thong-tin dd { margin: 0; overflow-wrap: anywhere; }
ol.buoc { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: b; }
ol.buoc > li { position: relative; padding: 8px 8px 8px 40px; border-left: 2px solid var(--vien); margin-left: 12px; counter-increment: b; }
ol.buoc > li::before { content: counter(b); position: absolute; left: -13px; top: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--mat); border: 2px solid var(--vien); font-size: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
ol.buoc > li.do::before { border-color: var(--do); color: var(--do); }
ol.buoc > li.vang::before { border-color: var(--vang); color: var(--vang); }
ol.buoc > li.xanh::before { border-color: var(--xanh); color: var(--xanh); }
ol.buoc > li .cham { position: absolute; left: 16px; top: 14px; }
ol.buoc > li:hover { background: var(--mat2); }
.b-y { font-size: 15px; }
.b-ct { font-size: 14px; color: var(--chu2); overflow-wrap: anywhere; }
.b-vs { font-size: 14px; color: var(--chu); margin-top: 2px; }
.nguon { font-size: 14px; color: var(--chu2); overflow-wrap: anywhere; }
.nguon code { background: var(--mat2); padding: 0 4px; border-radius: 4px; }
.de-xuat-bien { font-size: 14px; min-width: 0; }
.ghi-chu { overflow-wrap: anywhere; min-width: 0; border-left: 4px solid var(--cam); background: var(--cam-nhat); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
.ghi-chu .gc-dau { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 700; margin-bottom: 2px; }
.ghi-chu p { margin: 3px 0; }
.ghi-chu .muc { font-weight: 700; }
.trong-buoc .ghi-chu { margin: 6px 0 2px; }
.buoc-khung.co-bien .trong-buoc .ghi-chu { display: none; }
.chips-bang { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-bang { border: 1px dotted var(--chu2); background: var(--mat2); border-radius: 6px; padding: 0 7px; font-size: 14px; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; }
.chip-bang.co-tin { border-style: solid; border-color: var(--ht); }
.chuoi { list-style: none; padding: 0; margin: 6px 0; }
.chuoi li { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--vien); font-size: 14px; }
.chuoi .t { font-weight: 700; color: var(--cam); }
/* Ngăn chi tiết */
.ngan { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--mat); border-left: 1px solid var(--vien); box-shadow: -4px 0 24px rgba(0,0,0,.15); z-index: 40; overflow-y: auto; padding: 16px; display: none; }
.ngan.mo { display: block; animation: truot .18s ease-out; }
@keyframes truot { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.ngan .dong { position: sticky; top: 0; float: right; }
.ngan h2 { font-size: 18px; margin: 0 0 4px; padding-right: 60px; }
.ngan ul { padding-left: 18px; margin: 4px 0; }
.ngan li { margin: 2px 0; font-size: 14px; }
.lien-ket { border: 0; background: none; padding: 0; color: var(--nv); cursor: pointer; text-decoration: underline; text-align: left; font-size: 14px; }
/* Tải */
.tai-n { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.ong { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.tang { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px 16px; background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 12px 14px; border-left: 6px solid var(--xanh); }
.tang.vang { border-left-color: var(--vang); } .tang.do { border-left-color: var(--do); }
.tang .ten { font-weight: 700; }
.tang .cap { font-size: 14px; color: var(--chu2); }
.thanh { height: 14px; background: var(--mat2); border-radius: 7px; overflow: hidden; display: flex; margin: 4px 0; }
.thanh .chay { background: var(--xanh); } .thanh .cho { background: var(--vang); } .thanh .cho.nang { background: var(--do); }
.mui-ten { text-align: center; color: var(--chu2); font-size: 14px; margin: -6px 0; }
table.bang { width: 100%; border-collapse: collapse; font-size: 14px; }
table.bang th, table.bang td { border-bottom: 1px solid var(--vien); padding: 6px 8px; text-align: left; vertical-align: top; }
table.bang th { color: var(--chu2); font-weight: 600; }
.cuon-ngang { overflow-x: auto; }
.luoi-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.an { display: none !important; }
footer { color: var(--chu2); font-size: 14px; padding: 20px 0 40px; }
@media (max-width: 860px) {
  .buoc-khung, .buoc-khung.khong-de-xuat { grid-template-columns: minmax(0, 1fr); }
  .buoc-khung.co-bien .trong-buoc .ghi-chu { display: block; }
  .de-xuat-bien { display: none; }
  .luoi-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  header.dau { position: static; }
  .ban { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; padding: 20px 10px 12px; }
  .nhan-hang { margin: -14px 0 -18px; }
  .tang { grid-template-columns: minmax(0, 1fr); }
  .dau h1 { font-size: 16px; }
  .cong-cu { margin-left: 0; }
  ol.buoc > li { padding-left: 34px; }
  .thong-tin { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .thong-tin dt { font-weight: 600; margin-top: 6px; }
}
</style>
</head>

ai/services/payment_service.py:2104"}]},{"id":"thuoc","ten":"Thuốc & kho","mo_ta":"Chọn lô, giao thuốc, bán lẻ, nhập kho, kiểm kê, vật tư","routes":["/pharmacy","/pharmacy/history","/pharmacy/consult","/pharmacy/inventory","/kho-vat-tu","/print/tem-lo"],"nho":[{"y":"Nút nào hiện là do MÁY CHỦ quyết (`dong.thao_tac`, `phan_lo[].thao_tac`); component không tự suy từ giai đoạn.","vi_sao":"Luật tiền–thuốc sống ở FastAPI; máy chủ kiểm lại từng lệnh.","nguon":"src/clinicai/services/ban_thuoc_service.py:111"},{"y":"Thuốc BÁN lúc thu tiền (SALE). [Giao thuốc] chỉ ghi DISPENSE = thuốc rời quầy.","vi_sao":"CP3: tách bán khỏi bàn giao.","nguon":"src/clinicai/services/pharmacy_service.py:686"},{"y":"Giao thuốc BẮT Idempotency-Key: một thao tác một khoá, gửi lại cũng chỉ trừ tồn một lần.","vi_sao":"16/09/2026: hai lần bấm cùng lúc, lô 50 viên còn 48.","nguon":"src/clinicai/api/v1/routers/pharmacy.py:1019"},{"y":"Tồn chỉ đổi qua sổ `inventory_txn`; trigger `inventory_txn_apply` cộng vào `drug_batch.quantity_on_hand`.","vi_sao":"Sổ và số dư không được lệch.","nguon":"supabase/migrations/20260919000003_tien_thuoc_cp3_phan_lo_ban.sql:151"},{"y":"Kiểm kê ca đếm MÙ; chốt chỉ ghi lệch, KHÔNG sửa tồn. Điều chỉnh là bước riêng, hoàn tác được.","vi_sao":"Đếm khách quan, nhập nhầm không đổi tồn.","nguon":"src/dashboard/app/(dashboard)/pharmacy/inventory/KiemKeCa.tsx:1"},{"y":"Giá thuốc có HAI nguồn (`drug_catalog.unit_price`, `service_price` nhóm thuoc); lệch → 'mâu thuẫn giá', không thu được. Sửa ở Bảng giá thuốc tự đồng bộ danh mục.","vi_sao":"24/09: lệch giá tự khoá quầy thu.","nguon":"src/clinicai/services/config_service.py:1644"}]},{"id":"check-out","ten":"Check-out","mo_ta":"Đối soát lượt khám rồi cho khách về","routes":["/reception/checkout"],"nho":[{"y":"Còn NỢ hoặc còn TIỀN THỪA chưa xử lý thì CHẶN check-out, kể cả 'về giữa chừng'. Lý do ngoại lệ KHÔNG vượt được — chỉ thu ngay hoặc ghi nợ.","vi_sao":"Luật 01/10/2026 sau sự cố 30/09. Vướng có cờ chan=True chặn trước mọi nhánh khác. (COMMAND_TIMEOUT = 15); asyncpg ném TimeoutError, ở Python 3.12 nó là con của OSError nên rơi vào nhánh 503 của src/clinicai/api/middleware.py:219-223.","sua":"Tách TimeoutError ra mã lỗi riêng (vd 504 “truy vấn quá lâu”) và ghi route vào kho lỗi để thấy câu nào chạm trần 15 giây (câu `WITH v AS` tối đa 14 giây đang sát trần).","muc":2,"viec":null,"pr":[],"nguon":"phát hiện mới, chưa kiểm chéo"},{"id":"dx-moi-sse-co-so","moi":true,"gan":{"loai":"ha_tang","id":"sse"},"van_de":"Mỗi tin pg_notify được phát tới MỌI tab của phòng khám (cả hai cơ sở), mỗi tab tự lọc — 1.000 tab thì một lần ghi đánh thức 1.000 tab.","vi_sao":"src/clinicai/core/change_broker.py:131-135 (vòng put_nowait cho mọi hàng của clinic_id); tin chỉ có {t, c} (supabase/migrations/20260806000001_notify_change_for_live_screens.sql:40).","sua":"Ở quy mô 40 nhân viên chưa cần. Khi có cơ sở thứ ba hoặc > 100 tab: thêm mã cơ sở vào tin và lọc ở broker (#534 C10, mức 3 vì đổi trigger).","muc":3,"viec":1,"pr":[],"nguon":"phát hiện mới (mở rộng #534 C10), chưa kiểm chéo"},{"id":"dx-moi-next-300s","moi":true,"gan":{"loai":"ha_tang","id":"next"},"van_de":"Next gọi FastAPI bằng fetch() không đặt hạn: khi API nghẽn, lời gọi chờ tới hạn mặc định của Node (~300 giây) rồi mới lỗi.","vi_sao":"src/dashboard/lib/backend-proxy.ts:133 fetch(`${API_BASE}${path}`) không có signal/timeout; src/dashboard/cluster.cjs:42 tắt requestTimeout của máy chủ Node.","sua":"Chưa cần ở tải hiện tại. Khi làm lỗi nhanh cho bể (dx-moi-pool-cho) thì đặt AbortSignal.timeout ~30 giây cho GET dựng trang (không cho tải tệp lên).","muc":2,"viec":null,"pr":[],"nguon":"phát hiện mới, chưa kiểm chéo"},{"id":"dx-moi-su-kien-tuan-tu","moi":true,"gan":{"loai":"ha_tang","id":"su-kien"},"van_de":"Worker su-kien là MỘT tiến trình giao tuần tự từng (sự kiện × bên nhận). Đợt đông (vd 1.000 lần thu) ⇒ 5.000 dòng giao xếp hàng, màn hành trình/check-out cập nhật trễ hàng phút.","vi_sao":"src/clinicai/worker.py:295-298 (for consumer … while lam_mot_dong); thu tiền có 5 bên nhận (src/clinicai/events/catalogue.py:2166).","sua":"Chưa cần ở ~1 sự kiện/giây. Đo: số dòng event_delivery chưa DONE và tuổi dòng cũ nhất mỗi phút (đã có v_event_delivery_suc_khoe). Khi tuổi > 10 giây lúc cao điểm: chạy thêm một bản su-kien (SKIP LOCKED đã cho phép song song, thứ tự theo đối tượng vẫn giữ).","muc":2,"viec":null,"pr":[],"nguon":"phát hiện mới, chưa kiểm chéo"},{"id":"dx-moi-dang-nhap-guard","moi":true,"gan":{"loai":"thao_tac","id":"dang-nhap","buoc":2},"van_de":"Nút [Đăng nhập] đi server action của Next, gọi thẳng gateway Supabase trong mạng docker — không đi qua auth-guard (giới hạn 20 lần/phút/IP chống dò mật khẩu). Chỉ đường /auth/v1/token* từ trình duyệt mới bị chặn.","vi_sao":"src/dashboard/app/(auth)/login/actions.ts:34 signInWithPassword qua getSupabaseServer() dùng SUPABASE_URL=http://clinicai_supabase_gateway:8000 (src/dashboard/lib/supabase-server.ts:21, .env.prod.example:35); guard chỉ gắn ở caddy/Caddyfile:186-189 và docker/auth-guard.conf.","sua":"Thử trên stack local: 30 lần sai liên tiếp qua form /login — có bị 429 không. Nếu không: cho server action gọi qua auth-guard (SUPABASE_URL trỏ vào guard cho đường token, kèm X-Forwarded-For thật của người dùng) hoặc đếm lần sai trong Postgres.","muc":3,"viec":7,"pr":[],"nguon":"phát hiện mới khi lần dây đăng nhập, chưa kiểm chéo"},{"id":"dx-moi-kuma-sao-luu","moi":true,"gan":{"loai":"ha_tang","id":"giam-sat"},"van_de":"Chuông Kuma “Sao lưu đêm” bị bản 15 phút che: hai unit dùng chung script, chung token đẩy Kuma và chung tệp trạng thái — đêm 02:15 hỏng thì 07:00 bản 15 phút báo xanh lại.","vi_sao":"scripts/backup-db.sh:637 (KUMA_PUSH_TOKEN_FILE mặc định), scripts/backup-db.sh:615 (backup-status.json); scripts/systemd/clinicai-backup-15p.service không đặt token riêng.","sua":"Mỗi unit một token Kuma + một tệp trạng thái (biến môi trường trong unit); gộp vào PR script sao lưu của việc 8.","muc":2,"viec":8,"pr":[],"nguon":"phát hiện mới khi lần dây sao lưu, chưa kiểm chéo"},{"id":"dx-moi-chi-dinh-sau-thu","moi":true,"gan":{"loai":"thao_tac","id":"chi-dinh-them-sau-thu-tien"},"van_de":"Bác sĩ chỉ định thêm khi khách đã thu tiền: không có chuông cho quầy thu. Quầy chỉ thấy nếu đang mở /thu-ngan và dòng SSE còn sống; không thì tới check-out mới lộ khoản nợ.","vi_sao":"service_order.placed chỉ có bên nhận dòng thời gian (src/clinicai/events/catalogue.py:1416-1426).","sua":"Hỏi Tuyền: có muốn réo quầy thu khi lượt đã thu có chỉ định mới không? Nếu có: thêm bên nhận chuông qua dây nối (dữ liệu), không sửa nơi phát.","muc":2,"viec":null,"pr":[],"nguon":"phát hiện mới, chưa kiểm chéo — cần Tuyền quyết nghiệp vụ"}],"tai":{"nhan":"PHÂN TÍCH THEO CODE + CẤU HÌNH — CHƯA CHẠY THỬ TẢI. Số nào ghi “đã đo” lấy từ prod 14–17/10; còn lại ước theo cấu hình.","kich_ban":"1.000 nhân viên cùng bấm một nút GHI (vd [Tạo bill]) trong cùng 1 giây, trong khi mỗi người còn mở 1 tab (1.000 dòng SSE). Hôm nay thật: 40 nhân viên, cao điểm 14–18 request/giây (đã đo).","tang":[{"id":"trinh-duyet","ten":"Trình duyệt","song_song":"mỗi tab tự gửi; HTTP/2 qua HTTPS nên không vướng trần 6 kết nối/tên miền","xep_hang":"không","n11":"ổn","n101":"ổn","n1000":"ổn — nhưng không có hạn chờ: người dùng thấy nút quay mãi","nguon":"src/dashboard/app/(dashboard)/thu-ngan/QuayThuNgan.tsx:356"},{"id":"caddy","ten":"Caddy","song_song":"Go, mỗi kết nối một goroutine — nhận hết 1.000","xep_hang":"không giới hạn số kết nối, không đặt hạn chờ upstream","n11":"ổn","n101":"ổn","n1000":"ổn (RAM 128 MB đủ cho vài nghìn kết nối nhàn)","nguon":"caddy/Caddyfile:191"},{"id":"next","ten":"Next.js (4 tiến trình Node)","song_song":"4 tiến trình × 1 luồng JS. Chuyển tiếp /api/* rẻ (~vài ms CPU + 1 lần getUser GoTrue); DỰNG TRANG thì đắt: ~163 ms CPU/trang","xep_hang":"trong vòng sự kiện Node của từng tiến trình","n11":"ổn","n101":"ổn cho lệnh ghi","n1000":"lệnh ghi qua được trong ~1–2 giây; nhưng SAU đó 1.000 tab dựng lại trang: 4 tiến trình × ~6 trang/giây ⇒ ~40 giây mới hết một đợt (ước)","nguon":"src/dashboard/cluster.cjs:3"},{"id":"gotrue","ten":"GoTrue","song_song":"Go, bể 10 kết nối DB; mỗi getUser ~2 ms (đo staging 14/08)","xep_hang":"bể 10 kết nối","n11":"ổn","n101":"ổn","n1000":"1.000 getUser + đợt dựng trang 2 getUser/tab ⇒ bể 10 bận vài giây (ước)","nguon":"docker-compose.supabase.yml:108"},{"id":"api","ten":"FastAPI (1 tiến trình uvicorn)","song_song":"MỘT vòng sự kiện async: chờ DB thì song song, phần CPU (xác minh JWT, pydantic, JSON) thì nối đuôi trên 1 nhân","xep_hang":"hàng chờ mượn kết nối của bể — KHÔNG có hạn chờ","n11":"ổn","n101":"người 21–101 chờ mượn kết nối ~0,1–0,5 giây (ước)","n1000":"người thứ 1.000 chờ ~5–15 giây (ước: ~0,13 giây/lệnh × 1.000 / 20 kết nối, cộng CPU 1 nhân). Không 5xx, chỉ chậm — trừ khi một câu SQL chạm trần 15 giây","nguon":"Dockerfile.api:41"},{"id":"pool","ten":"Bể asyncpg (20 kết nối; lúc đo 10)","song_song":"tối đa 20 lệnh cùng chạm DB (staging 10)","xep_hang":"người thứ 21 trở đi chờ trong bộ nhớ API cho tới khi có người trả kết nối","n11":"ổn (≤ 20)","n101":"81 người chờ; mỗi kết nối xoay ~7 lệnh/giây ⇒ hết hàng sau ~0,7 giây (ước)","n1000":"980 người chờ ⇒ ~7 giây (ước); bộ canh POOL_API_DAY kêu khi chờ > 2 giây","nguon":"src/clinicai/core/database.py:24"},{"id":"postgres","ten":"Postgres 17 (100 kết nối)","song_song":"~30/100 kết nối đang dùng (đã đo); API ≤ 20, GoTrue 10, PostgREST 10, worker…","xep_hang":"khoá dòng: hai người thu CÙNG một lượt thì người sau chờ khoá FOR UPDATE của người trước","n11":"ổn","n101":"ổn","n1000":"không cạn kết nối (bể chặn trước). Tranh chấp chỉ khi cùng một lượt khám; khác lượt thì không chặn nhau","nguon":"src/clinicai/services/payment_service.py:778"},{"id":"su-kien","ten":"Worker su-kien (1 tiến trình, tuần tự)","song_song":"KHÔNG song song: mỗi (sự kiện × bên nhận) một giao dịch, làm lần lượt","xep_hang":"event_delivery — nằm trên đĩa, không mất","n11":"ổn (≤ 1 giây)","n101":"~500 dòng giao ⇒ ~5–15 giây (ước 10–30 ms/dòng)","n1000":"~5.000 dòng giao ⇒ ~1–3 phút; màn hành trình/check-out trễ tương ứng; mỗi bên nhận ghi xong lại bắn tin ⇒ mọi tab dựng lại liên tục suốt quãng đó","nguon":"src/clinicai/worker.py:295"},{"id":"sse","ten":"Bộ phát SSE (1.000 dòng mở)","song_song":"mỗi tab: 1 kết nối Caddy + 1 fetch trong Next + 1 task asyncio + hàng 8 tin trong API; KHÔNG giữ kết nối DB","xep_hang":"hàng 8 tin / tab — đầy thì bỏ tin mới","n11":"ổn","n101":"ổn","n1000":"mỗi NOTIFY đánh thức 1.000 hàng; tab chậm đầy hàng ⇒ mất tin (màn đứng số cũ)","nguon":"src/clinicai/core/change_broker.py:131"}],"co_chai":"Nút cổ chai ĐẦU TIÊN không nằm ở lệnh ghi mà ở DÂY CHUYỀN LÀM MỚI sau đó: mỗi lần ghi bắn tin tới mọi tab, mỗi tab dựng lại trang (Next ~163 ms CPU/trang + layout gọi /phan-quyen/toi 200–500 câu SQL). Với 1.000 tab, một đợt tin = ~1.000 lần dựng trang ≈ 40 giây CPU của 4 tiến trình Next và vài trăm nghìn câu SQL. Lệnh ghi thì bể 20 kết nối nuốt được (người thứ 1.000 chờ vài giây). Hôm nay 40 tab: một đợt = ~40 lần dựng ≈ 1,6 giây — đúng cảm giác “màn giật” đã đo.","nguoi":[{"so":11,"y":"Không chờ: 11 ≤ 20 kết nối. Ghi ~0,13 giây. Màn của 11 người dựng lại ~3 lần như hôm nay."},{"so":101,"y":"Chờ mượn kết nối dưới 1 giây (ước). Worker su-kien tụt sau ~5–15 giây: khách hiện ở phòng / hành trình trễ."},{"so":1000,"y":"Không lỗi 5xx ngay — mọi người CHỜ: người cuối ~5–15 giây cho lệnh ghi (ước). Rồi 1.000 tab cùng dựng lại trang mỗi đợt tin ⇒ màn đơ hàng chục giây, worker su-kien trễ 1–3 phút. Lỗi chỉ xuất hiện khi: một câu SQL > 15 giây (⇒ 503), hoặc Next chờ API > ~300 giây (⇒ lỗi mạng), hoặc một người vượt 400 lượt gọi/phút (⇒ 429)."}],"an_toan":[{"y":"Hai người cùng bấm Thu một khoản: người đến sau chờ khoá dòng lượt (SELECT … FOR UPDATE) rồi tính lại hoá đơn — thấy đã thu ⇒ bị từ chối; nếu chen đúng lúc thì chỉ mục UNIQUE uq_payment_cycle_mot_lan_song chặn ⇒ 409 “vừa được thu ở một lần thu khác”. Cả giao dịch lùi, không ghi gì.","nguon":"src/clinicai/services/payment_service.py:813"},{"y":"Một người bấm đúp (hoặc mất mạng bấm lại): cùng Idempotency-Key ⇒ biên nhận lệnh trả lại đúng kết quả lần đầu, không ghi lần hai.","nguon":"src/clinicai/services/payment_service.py:779"},{"y":"Màn hiện số cũ mà bấm Thu: bill_revision của trình duyệt lệch ⇒ BILL_CHANGED, máy chủ không bao giờ ghi số trình duyệt gửi.","nguon":"src/clinicai/services/payment_service.py:388"},{"y":"Hai người đặt cùng một giờ: trigger enforce_slot_capacity + khoá theo (bác sĩ, khung 15 phút) xếp hàng hai lệnh ghi; giữ chỗ 10 phút chỉ là lời báo.","nguon":"docs/SO-LUAT.md:183"},{"y":"Worker su-kien chết giữa chừng: dòng giao có hạn nhận 120 giây rồi quay lại hàng; ghi xong và đánh dấu xong trong cùng một giao dịch.","nguon":"src/clinicai/events/worker.py:1"}],"cach_do":["Đo trên STACK LOCAL (scripts/dev-up.sh, khách DEMO-*, tài khoản @dr4women.local), API/web của nhánh ở cổng riêng 32xx/82xx. KHÔNG đo trên VPS.","Bắn tải bằng k6 hoặc `hey` qua Next (đúng đường người dùng): 10 → 50 → 200 lệnh ghi/giây trong 60 giây, mỗi lệnh một visit DEMO khác nhau; song song mở 40 / 200 tab giả (EventSource) để đo dây chuyền làm mới.","Ghi lại: p50/p95 lệnh ghi; chờ-mượn bể (dòng api_nhip_phut); số lần dựng trang/giây ở Next (log Caddy); số dòng event_delivery chưa DONE + tuổi dòng cũ nhất; CPU từng container (docker stats).","Chạy cùng kịch bản trước/sau mỗi PR việc 1–3 để thấy số dựng-trang-mỗi-lần-ghi giảm từ ~10 về ~1."]},"hang_doi":{"tra_loi":"KHÔNG dùng RabbitMQ, Redis hay hàng đợi ngoài. Hệ thống dùng: Postgres LISTEN/NOTIFY (trigger notify_row_change → pg_notify) để báo màn; bảng domain_event + event_delivery làm “hàng đợi trên đĩa”; một worker su-kien đọc bảng và giao cho bên nhận. RabbitMQ còn trong docker-compose.yml nhưng chỉ ở profile `workers`, không bật trên prod.","nguon":["src/clinicai/core/change_broker.py:1","src/clinicai/events/worker.py:1","docker-compose.yml:393"],"nguong":[{"thu":"Redis (cache / hàng chờ)","lat_lai_khi":"p95 một màn > 800 ms VÀ chứng minh nguyên nhân là số vòng, không phải thiếu chỉ mục","hien_tai":"Có màn vượt (quầy thu p95 ~3,4 giây) nhưng nguyên nhân ĐÃ biết là N+1 trong code (300–2.000 câu/lần tải) và câu thiếu mốc dưới — sửa code trước. Cache chỉ mua thêm số cũ cho màn tiền.","ket_luan":"chưa cần"},{"thu":"Thêm bản sao ứng dụng (2+ uvicorn)","lat_lai_khi":"CPU backend > 70% kéo dài; trước đó phải chuyển bộ đếm giới hạn truy cập sang Postgres","hien_tai":"Chưa có số CPU api kéo dài (cần đo). Cao điểm 14–18 req/s; CPU dashboard 130% lúc cao điểm (Caddyfile ghi 14/10) — tức Next nóng trước API, do dựng trang dây chuyền.","ket_luan":"chưa cần — đo CPU api trước"},{"thu":"Broker sự kiện (RabbitMQ/Kafka)","lat_lai_khi":"(SO-LUAT Phần 9: đã chốt “gửi tin bằng sổ”) — đề xuất ngưỡng: event_delivery tồn > 10 giây lúc cao điểm dù đã chạy 2 bản su-kien","hien_tai":"~1 sự kiện/giây; trễ hiện tại do nghỉ cứng 1 giây, không do thiếu broker.","ket_luan":"chưa cần"},{"thu":"Elasticsearch / ClickHouse cho log","lat_lai_khi":"nhật ký vượt ~50 triệu dòng","hien_tai":"~2.400 dòng/ngày (dưới 1 GB/năm).","ket_luan":"chưa cần"}],"can_do":["CPU api và dashboard theo phút lúc 18–21h (docker stats hoặc /ops) — để biết khi nào chạm 70%.","Chờ-mượn bể p95 (đã có trong dòng log api_nhip_phut) — trên 1 giây thì mới bàn tăng bể/thêm bản sao.","Tuổi dòng event_delivery cũ nhất chưa DONE (v_event_delivery_suc_khoe) — trên 10 giây thì chạy thêm bản su-kien trước khi bàn broker.","Số lần dựng trang mỗi lần ghi (log Caddy) — mục tiêu ~1 sau việc 1."]},"gioi_thieu":{"mot_cau":"Mỗi khối lego là một phần của phòng khám (hoặc một cỗ máy chạy nó). Bấm một thao tác ở trên: dây nó đi qua sáng cam, khối liên quan đổi màu, bên dưới hiện từng bước với chấm đỏ (chậm) / vàng (cần để ý) / xanh (ổn).","day":[{"kieu":"goi","y":"Gọi API — chờ trả lời ngay (đồng bộ)"},{"kieu":"su-kien","y":"Sự kiện — báo tin rồi việc chạy sau (bất đồng bộ)"},{"kieu":"bang","y":"Đọc / ghi bảng — dùng chung dữ liệu"}],"nhan_tg":{"do":"đã đo (prod 14–17/10: log Caddy + pg_stat_statements)","uoc":"ước theo code (số câu SQL × ~0,8 ms + ~4 ms mỗi lượt gọi — SO-LUAT Phần 5)"}},"chua_phu":["Màn in (/print/*), cổng khách (/portal), màn tivi (/display, /truong-ca/tv): chỉ xếp khối, chưa vẽ thao tác.","Trợ lý AI / giọng nói (orchestrator, PhoWhisper): ngoài phạm vi bản đồ này.","Hoá đơn công ty / MISA / kế toán: có trong khối Báo cáo nhưng chưa có thao tác chi tiết (xem #526 C4).","Thời gian “ước theo code” chưa kiểm bằng đo tải — xem mục Cách đo.","Phân tích tĩnh đếm `await conn.*` sâu 2 tầng: hàm gọi qua đối tượng khác (vd ServiceRoutingService(pool=None)…) có thể bị đếm thiếu."]};/*<</DU-LIEU>>*/</script>
<script>
(function () {
"use strict";
var D = window.LEGO;
var $ = function (s) { return document.querySelector(s); };
var trangThai = { cheDo: "nv", op: null, deXuat: true, buocChi: null };

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function giaTri(k) {
  var c = D.cau_hinh[k]; if (!c) return "?";
  var v = String(c.gia_tri).replace(/_/g, "");
  if (/^\d+\.0$/.test(v)) v = v.slice(0, -2);
  if (/^\d{4,}$/.test(v)) v = Number(v).toLocaleString("vi-VN");
  return v;
}
function dien(s) { return String(s).replace(/\{([a-z_0-9]+)\}/g, function (_, k) { return giaTri(k); }); }
function ngan(p) { var m = String(p || "").match(/([\w()\[\].-]+\.(?:py|tsx?|sql|md|json|sh|cjs|yml|service|timer)):(\d+)/); return m ? m[1] + ":" + m[2] : p; }
function maNguon(p) { if (!p) return ""; return '<span class="nguon"><code title="' + esc(p) + '">' + esc(p) + "</code></span>"; }

var KHOI_NV = D.khoi_nghiep_vu, KHOI_HT = D.khoi_ha_tang;
var TEN = {};
KHOI_NV.forEach(function (k) { TEN[k.id] = k.ten; });
KHOI_HT.forEach(function (k) { TEN[k.id] = k.ten; });
var OPS = D.thao_tac, OP = {};
OPS.forEach(function (o) { OP[o.id] = o; });
var DX = D.de_xuat, DXID = {};
DX.forEach(function (d) { DXID[d.id] = d; });
// Đề xuất gắn theo bước của thao tác: id thao tác → số bước → [đề xuất]
function deXuatCuaBuoc(op, i) {
  var ra = [];
  (op.buoc[i].de_xuat || []).forEach(function (id) { if (DXID[id]) ra.push(DXID[id]); });
  DX.forEach(function (d) { if (d.gan.loai === "thao_tac" && d.gan.id === op.id && d.gan.buoc === i + 1 && ra.indexOf(d) < 0) ra.push(d); });
  return ra;
}
function deXuatCua(loai, id) { return DX.filter(function (d) { return d.gan.loai === loai && d.gan.id === id && !d.gan.buoc; }); }
function denCua(op) {
  var c = op.buoc.map(function (b) { return b.den; });
  return c.indexOf("do") >= 0 ? "do" : c.indexOf("vang") >= 0 ? "vang" : "xanh";
}

// ── Chú giải ──
function veChuGiai() {
  var g = D.gioi_thieu || {};
  $("#gioi-thieu").textContent = g.mot_cau || "";
  var net = { goi: "", "su-kien": "7 5", bang: "2 5" };
  var h = '<span><span class="cham do"></span> chậm</span><span><span class="cham vang"></span> cần để ý</span><span><span class="cham xanh"></span> ổn</span>';
  (g.day || []).forEach(function (d) {
    h += '<span><svg width="44" height="10"><line x1="2" y1="5" x2="42" y2="5" stroke="currentColor" stroke-width="2.5" stroke-dasharray="' + net[d.kieu] + '"/></svg> ' + esc(d.y) + "</span>";
  });
  h += '<span><span class="the-tt do-that">đã đo</span> ' + esc((g.nhan_tg || {}).do || "") + '</span><span><span class="the-tt uoc">ước</span> ' + esc((g.nhan_tg || {}).uoc || "") + "</span>";
  h += '<span><span class="lego-mau" style="display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--nv-nhat);border:2px solid var(--nv);vertical-align:middle"></span> khối nghiệp vụ</span><span><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--ht-nhat);border:2px solid var(--ht);vertical-align:middle"></span> khối hạ tầng</span><span><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--cam-nhat);border:2px solid var(--cam);vertical-align:middle"></span> đang đi qua</span>';
  $("#chu-giai").innerHTML = h;
}

// ── Thao tác ──
function veThaoTac() {
  var noiBat = OPS.filter(function (o) { return o.noi_bat; });
  var h = "<h2>Chọn một thao tác — dây nó đi qua sẽ sáng lên</h2><div class='hang-chip'>";
  noiBat.forEach(function (o) { h += chipOp(o); });
  h += "</div><details class='nhom'><summary>Tất cả " + OPS.length + " thao tác, theo khối</summary>";
  KHOI_NV.forEach(function (k) {
    var ds = OPS.filter(function (o) { return o.khoi === k.id; });
    if (!ds.length) return;
    h += "<div class='nhom-khoi'><h3>" + esc(k.ten) + " (" + ds.length + ")</h3><div class='hang-chip'>" + ds.map(chipOp).join("") + "</div></div>";
  });
  var ht = OPS.filter(function (o) { return KHOI_NV.every(function (k) { return k.id !== o.khoi; }); });
  if (ht.length) h += "<div class='nhom-khoi'><h3>Hạ tầng / tự chạy</h3><div class='hang-chip'>" + ht.map(chipOp).join("") + "</div></div>";
  h += "</details>";
  $("#thao-tac").innerHTML = h;
}
function chipOp(o) { return '<button class="chip" data-op="' + esc(o.id) + '" aria-pressed="' + (trangThai.op === o.id) + '"><span class="cham ' + denCua(o) + '"></span>' + esc(o.ten) + "</button>"; }

// ── Bàn lego ──
var THU_TU_NV = ["dat-lich", "tiep-don", "kham", "phong-dv", "ket-qua-cskh", "check-out", "thuoc", "thu-ngan", "bao-cao", "nhan-su", "cai-dat"];
var THU_TU_HT = ["trinh-duyet", "caddy", "next", "api", "gotrue", "postgrest", "sse", "postgres", "giam-sat", "sao-luu", "day-tep", "su-kien"];
function veBan() {
  var ban = $("#ban");
  ban.querySelectorAll(".lego, .nhan-hang").forEach(function (n) { n.remove(); });
  var laNv = trangThai.cheDo === "nv";
  var ds = laNv ? THU_TU_NV.map(function (id) { return KHOI_NV.filter(function (k) { return k.id === id; })[0]; }).filter(Boolean)
                : THU_TU_HT.map(function (id) { return KHOI_HT.filter(function (k) { return k.id === id; })[0]; }).filter(Boolean);
  ds.forEach(function (k, i) {
    if (laNv && i === 8) { var n = document.createElement("div"); n.className = "nhan-hang"; n.textContent = "Khối hỗ trợ (dùng chung cho mọi bước)"; ban.appendChild(n); }
    var b = document.createElement("button");
    b.className = "lego" + (laNv ? "" : " ht");
    b.dataset.khoi = k.id;
    var soOp = OPS.filter(function (o) { return laNv ? o.qua.indexOf(k.id) >= 0 : o.ha_tang.indexOf(k.id) >= 0; }).length;
    var soBang = Object.keys(D.bang).filter(function (t) { return D.bang[t].chu === k.id; }).length;
    var soDx = DX.filter(function (d) { return (d.gan.loai === (laNv ? "khoi" : "ha_tang") && d.gan.id === k.id) || (laNv && d.gan.loai === "thao_tac" && OP[d.gan.id] && OP[d.gan.id].khoi === k.id); }).length;
    var h = '<span class="ten">' + esc(k.ten) + '</span><span class="mo-ta">' + esc(k.mo_ta) + "</span>";
    if (!laNv && k.so) h += '<ul class="so">' + k.so.map(function (s) { return "<li>" + esc(dien(s)) + "</li>"; }).join("") + "</ul>";
    h += '<span class="dem">' + soOp + " thao tác" + (laNv ? " · " + soBang + " bảng" : "") + "</span>";
    if (trangThai.deXuat && soDx) h += '<span class="huy-hieu" title="' + soDx + ' đề xuất">' + soDx + "</span>";
    b.innerHTML = h;
    b.setAttribute("aria-label", k.ten + ", " + soOp + " thao tác");
    ban.appendChild(b);
  });
  toSang();
  requestAnimationFrame(veDay);
}
function toSang() {
  var ban = $("#ban"), op = trangThai.op ? OP[trangThai.op] : null;
  ban.classList.toggle("co-chon", !!op);
  ban.querySelectorAll(".lego").forEach(function (b) {
    var id = b.dataset.khoi;
    var qua = op ? (trangThai.cheDo === "nv" ? op.qua : op.ha_tang) : [];
    b.classList.toggle("sang", qua.indexOf(id) >= 0);
    b.classList.toggle("chinh", !!op && trangThai.cheDo === "nv" && op.khoi === id);
    var chi = trangThai.buocChi;
    b.classList.toggle("chi", !!(op && chi != null && (op.buoc[chi].lop || []).indexOf(id) >= 0 && trangThai.cheDo === "ht"));
  });
}
function dayCoBan() {
  if (trangThai.cheDo === "ht") return D.day_ha_tang.map(function (d) { return [d[0], d[1], d[2]]; });
  var gap = {};
  OPS.forEach(function (o) { o.day_nv.forEach(function (d) { var k = d[0] + ">" + d[1]; if (!gap[k]) gap[k] = d; }); });
  return Object.keys(gap).map(function (k) { return gap[k]; });
}
function veDay() {
  var ban = $("#ban"), svg = $("#day-noi");
  var r0 = ban.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + r0.width + " " + r0.height);

  var net = { goi: "", "su-kien": "8 6", bang: "2 6" };
  var h = '<defs><marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--day)"/></marker><marker id="mui-cam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--cam)"/></marker></defs>';

    var dx = bx - ax, dy = by - ay, p1, p2, s, e;

      if (canh) { s = [ax, a.y]; e = [bx, b.y]; var cao = Math.min(60, 18 + len / 12); p1 = [ax, a.y - cao]; p2 = [bx, b.y - cao]; }
      else { p1 = [(s[0] + e[0]) / 2, s[1]]; p2 = [(s[0] + e[0]) / 2, e[1]]; }
    } else if (Math.abs(dx) < 10) { // cùng cột
      var xa = Math.abs(dy) > a.h * 1.8;
      s = [ax + (xa ? a.w / 2 : 0), ay + (xa ? 0 : Math.sign(dy) * a.h / 2)]; e = [bx + (xa ? b.w / 2 : 0), by - (xa ? 0 : Math.sign(dy) * b.h / 2)];
      if (xa) { p1 = [s[0] + 40, s[1]]; p2 = [e[0] + 40, e[1]]; } else { p1 = [s[0], (s[1] + e[1]) / 2]; p2 = [e[0], (s[1] + e[1]) / 2]; }
    } else {
      s = [ax, ay + Math.sign(dy) * a.h / 2]; e = [bx, by - Math.sign(dy) * b.h / 2];
      p1 = [s[0], (s[1] + e[1]) / 2]; p2 = [e[0], (s[1] + e[1]) / 2];
    }

    return '<path d="M' + s[0] + "," + s[1] + " C" + p1[0] + "," + p1[1] + " " + p2[0] + "," + p2[1] + " " + e[0] + "," + e[1] + '" fill="none" stroke="' + mau + '" stroke-width="' + (laSang ? 3.2 : 1.4) + '" stroke-dasharray="' + net[d[2]] + '" opacity="' + (laSang ? 1 : (op ? 0.25 : 0.6)) + '" marker-end="url(#' + (laSang ? "mui-cam" : "mui") + ')"/>';
  }

}

    var lam = n <= 1 ? "1 người — rảnh" : n <= 11 ? t.n11 : n <= 101 ? t.n101 : t.n1000;
    if (i) h += "<div class='mui-ten' aria-hidden='true'>▼</div>";
    h += "<div class='tang " + den + "'><div><div class='ten'><span class='cham " + den + "'></span> " + esc(t.ten) + "</div><div class='cap'>" + (cap >= 1e9 ? "không giới hạn" : "chạy cùng lúc tối đa " + cap) + "</div><div class='thanh' title='xanh = đang chạy, vàng/đỏ = đang chờ'><span class='chay' style='width:" + pc + "%'></span><span class='cho" + (den === "do" ? " nang" : "") + "' style='width:" + pw + "%'></span></div><div class='cap'>" + (cap >= 1e9 ? n + " chạy" : chay + " chạy · " + cho + " chờ") + "</div></div><div><div><b>Song song:</b> " + esc(t.song_song) + "</div><div><b>Xếp hàng ở:</b> " + esc(t.xep_hang) + "</div><div><b>Với " + n.toLocaleString("vi-VN") + " người:</b> " + esc(lam) + "</div>" + maNguon(t.nguon) + "</div></div>";
  });
  h += "</div>";
  h += "<div class='the' style='margin-top:14px'><h2>Nút cổ chai đầu tiên</h2><p>" + esc(T.co_chai) + "</p><h3>Người thứ 11, 101, 1.000</h3><ul>" + T.nguoi.map(function (x) { return "<li><b>" + x.so.toLocaleString("vi-VN") + ":</b> " + esc(x.y) + "</li>"; }).join("") + "</ul></div>";
  h += "<div class='luoi-2' style='margin-top:14px'><div class='the'><h2>Hai người bấm cùng một khoản</h2><ul>" + T.an_toan.map(function (a) { return "<li>" + esc(a.y) + "<br>" + maNguon(a.nguon) + "</li>"; }).join("") + "</ul></div>";
  h += "<div class='the'><h2>Có dùng RabbitMQ / Redis / hàng đợi không?</h2><p>" + esc(Q.tra_loi) + "</p><p>" + Q.nguon.map(maNguon).join(" ") + "</p></div></div>";
  h += "<div class='the' style='margin-top:14px'><h2>Ngưỡng đã chốt (SO-LUAT Phần 7) đặt cạnh số đo hôm nay</h2><div class='cuon-ngang'><table class='bang'><thead><tr><th>Hạ tầng</th><th>Lật lại khi</th><th>Hôm nay</th><th>Kết luận</th></tr></thead><tbody>" + Q.nguong.map(function (r) { return "<tr><td><b>" + esc(r.thu) + "</b></td><td>" + esc(r.lat_lai_khi) + "</td><td>" + esc(r.hien_tai) + "</td><td>" + esc(r.ket_luan) + "</td></tr>"; }).join("") + "</tbody></table></div><h3>Cần đo gì để biết khi nào cần</h3><ul>" + Q.can_do.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul><h3>Cách đo (stack local, không đo trên VPS)</h3><ol>" + T.cach_do.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ol></div>";
  h += "<div class='the' style='margin-top:14px'><h2>Số cấu hình thật dùng ở trang này</h2><div class='cuon-ngang'><table class='bang'><tbody>" + Object.keys(D.cau_hinh).map(function (k) { var c = D.cau_hinh[k]; return "<tr><td>" + esc(c.y) + "</td><td><b>" + esc(giaTri(k)) + "</b></td><td>" + maNguon(c.nguon) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
  $("#vung-tai").innerHTML = h;
}

// ── Điều khiển ──
function datCheDo(c) {
  trangThai.cheDo = c; trangThai.buocChi = null;
  document.querySelectorAll("[data-che-do]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.cheDo === c)); });
  $("#vung-ban").classList.toggle("an", c === "tai");
  $("#vung-tai").classList.toggle("an", c !== "tai");
  if (c === "tai") veTai(); else { veBan(); veBuoc(); }
  luuHash();
}
function chonOp(id) {
  trangThai.op = trangThai.op === id ? null : id; trangThai.buocChi = null;
  if (trangThai.cheDo === "tai") datCheDo("nv");
  document.querySelectorAll(".chip[data-op]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.op === trangThai.op)); });
  toSang(); veDay(); veBuoc(); luuHash();
}
function luuHash() { try { history.replaceState(null, "", "#" + trangThai.cheDo + (trangThai.op ? "/" + trangThai.op : "")); } catch (e) { /* file:// cũ */ } }
function docHash() { var m = (location.hash || "").slice(1).split("/"); if (["nv", "ht", "tai"].indexOf(m[0]) >= 0) trangThai.cheDo = m[0]; if (m[1] && OP[m[1]]) trangThai.op = m[1]; }

document.addEventListener("click", function (e) {
  var t = e.target.closest("button, [data-bang]"); if (!t) return;
  if (t.dataset.cheDo) return datCheDo(t.dataset.cheDo);
  if (t.dataset.op) { $("#ket-qua-tim").classList.remove("mo"); if (t.closest(".ngan")) dongNgan(); return chonOp(t.dataset.op); }
  if (t.dataset.bang) { $("#ket-qua-tim").classList.remove("mo"); return moBang(t.dataset.bang); }
  if (t.dataset.khoiTim) { $("#ket-qua-tim").classList.remove("mo"); var laHt = KHOI_HT.some(function (k) { return k.id === t.dataset.khoiTim; }); if ((laHt ? "ht" : "nv") !== trangThai.cheDo) datCheDo(laHt ? "ht" : "nv"); return moKhoi(t.dataset.khoiTim); }
  if (t.dataset.khoi) return moKhoi(t.dataset.khoi);
  if (t.dataset.n) { N_CHON = Number(t.dataset.n); return veTai(); }
  if (t.id === "dong-ngan") return dongNgan();
  if (t.id === "doi-nen") {
    var r = document.documentElement, toi = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = toi ? "light" : "dark"; try { localStorage.setItem("lego-nen", r.dataset.theme); } catch (x) { /* không có kho */ }
    return requestAnimationFrame(veDay);
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { dongNgan(); $("#ket-qua-tim").classList.remove("mo"); } });
$("#o-tim").addEventListener("input", function (e) { tim(e.target.value); });
$("#bat-de-xuat").addEventListener("change", function (e) { trangThai.deXuat = e.target.checked; if (trangThai.cheDo !== "tai") { veBan(); veBuoc(); } });
$("#buoc").addEventListener("mouseover", function (e) { var li = e.target.closest("li[data-buoc]"); var i = li ? Number(li.dataset.buoc) : null; if (i !== trangThai.buocChi) { trangThai.buocChi = i; toSang(); } });
$("#buoc").addEventListener("mouseleave", function () { trangThai.buocChi = null; toSang(); });
if (window.ResizeObserver) new ResizeObserver(function () { requestAnimationFrame(veDay); }).observe($("#ban")); else window.addEventListener("resize", veDay);
try { var nen = localStorage.getItem("lego-nen"); if (nen) document.documentElement.dataset.theme = nen; } catch (x) { /* không có kho */ }

$("#chan").innerHTML = "Sinh bởi <code>scripts/lego-data.py</code> từ <code>docs/lego/viet-tay.json</code> + code " + esc(D.goc_code) + " · cập nhật " + esc(D.sinh_luc) + ". Chưa phủ: " + D.chua_phu.map(esc).join(" · ");
veChuGiai(); veThaoTac(); docHash(); datCheDo(trangThai.cheDo);
document.querySelectorAll(".chip[data-op]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.op === trangThai.op)); });
})();
</script>
</body>
</html>
