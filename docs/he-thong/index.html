  bên dưới, do scripts/he-thong-data.py ghi vào — đừng sửa tay khối ấy, sửa

<style>
:root {
  --nen: #fcfcfb; --mat: #ffffff; --mat2: #f3f2ee; --vien: #e1e0d9;
  --chu: #1b1b19; --chu2: #55534c;
  --nhan: #2f5bd3; --nhan-nen: #eaf0fd;
  --do: #d03b3b; --vang: #fab219; --xanh: #0ca30c;
  --do-nen: #fbecec; --vang-nen: #fff6de; --xanh-nen: #e8f6e8;
  --bong: 0 1px 2px rgba(11,11,11,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nen: #1a1a19; --mat: #222220; --mat2: #2b2b29; --vien: #3a3a37;
    --chu: #ecebe6; --chu2: #b4b2a9;
    --nhan: #8fa9ff; --nhan-nen: #252e4d;
    --do-nen: #3a2020; --vang-nen: #3a3119; --xanh-nen: #1c331c;
    --bong: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --nen: #1a1a19; --mat: #222220; --mat2: #2b2b29; --vien: #3a3a37;
  --chu: #ecebe6; --chu2: #b4b2a9;
  --nhan: #8fa9ff; --nhan-nen: #252e4d;
  --do-nen: #3a2020; --vang-nen: #3a3119; --xanh-nen: #1c331c;
  --bong: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--nen); color: var(--chu);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere;
}
a { color: var(--nhan); }
code, .ma { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
.ma { color: var(--chu2); }
h1 { font-size: 24px; margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 20px; margin: 28px 0 10px; line-height: 1.3; }
h3 { font-size: 17px; margin: 0 0 8px; line-height: 1.35; }
p { margin: 6px 0; }
ul { margin: 6px 0; padding-left: 20px; }
li { margin: 3px 0; }
.khung { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.dau { border-bottom: 1px solid var(--vien); background: var(--mat); }
header.dau .khung { padding-top: 16px; padding-bottom: 12px; }
.phu { color: var(--chu2); font-size: 14px; }
.hang-nut { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
button, .nut {
  font: inherit; font-size: 14px; min-height: 36px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--vien); background: var(--mat); color: var(--chu); cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover, .nut:hover { background: var(--mat2); }
button[aria-pressed="true"], button[aria-selected="true"] { background: var(--nhan-nen); border-color: var(--nhan); color: var(--chu); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--nhan); outline-offset: 2px; }
nav.tab { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
nav.tab button { font-weight: 600; }
.chu-giai { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--chu2); margin-top: 8px; }

/* chấm trạng thái: luôn đi kèm biểu tượng + chữ, không để màu nói một mình */
.cham { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; white-space: nowrap; }
.cham i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 14px; line-height: 1; font-weight: 700; color: #fff; }
.cham.do i { background: var(--do); }
.cham.vang i { background: var(--vang); color: #0b0b0b; border-radius: 3px; }
.cham.xanh i { background: var(--xanh); }
.the-nguon { display: inline-block; font-size: 14px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--vien); color: var(--chu2); white-space: nowrap; }
.the-nguon.da-do { border-color: var(--nhan); color: var(--nhan); }

.the { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 14px 16px; box-shadow: var(--bong); }
.luoi { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.luoi-o { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin: 10px 0 14px; }
.o-so { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 12px 14px; border-top: 4px solid var(--vien); }
.o-so.do { border-top-color: var(--do); } .o-so.vang { border-top-color: var(--vang); } .o-so.xanh { border-top-color: var(--xanh); }
.o-so .so { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 4px 0; font-variant-numeric: tabular-nums; }
.o-so .nhan { font-size: 14px; color: var(--chu2); }

.ds { list-style: none; padding: 0; margin: 8px 0; }
.ds li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--vien); }
.ds li:first-child { border-top: 0; }
.ds .noi { grid-column: 2; font-size: 14px; color: var(--chu2); }
.ds .noi.lech { color: var(--do); }

/* ô đề xuất kiểu bình luận bên lề — bật/tắt ở đầu trang */
.co-bl { display: grid; gap: 12px 18px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .co-bl { grid-template-columns: minmax(0, 1fr) 300px; } }
.an-bl .co-bl { grid-template-columns: 1fr; }
.an-bl .bl { display: none; }
.bl { align-self: start; background: var(--nhan-nen); border-left: 4px solid var(--nhan); border-radius: 4px 10px 10px 4px; padding: 10px 12px; font-size: 15px; }
.bl b.tieu { display: block; font-size: 14px; color: var(--chu2); margin-bottom: 4px; }
.bl p { margin: 6px 0; }
.muc { display: inline-block; font-size: 14px; font-weight: 700; padding: 0 7px; border-radius: 6px; border: 1px solid var(--nhan); color: var(--nhan); margin-right: 4px; }

/* sơ đồ máy */
.may h3 { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.may .vt { padding: 8px 0; border-top: 1px dashed var(--vien); }
.may .vt:first-of-type { border-top: 0; }
.noi-may { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin: 12px 0; }
.noi-may div { font-size: 15px; background: var(--mat2); border-radius: 8px; padding: 8px 10px; }
.lan { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 10px; }
.lan > div { border: 1px solid var(--vien); border-radius: 10px; padding: 10px; background: var(--mat2); }
.chip-dv { display: inline-flex; flex-direction: column; margin: 3px; padding: 4px 8px; border-radius: 8px; background: var(--mat); border: 1px solid var(--vien); font-size: 14px; line-height: 1.3; }
.chip-dv small { color: var(--chu2); font-size: 14px; }
.chip-dv.tat { opacity: .55; text-decoration: line-through; }

/* chuỗi đường đi */
.chuoi { display: flex; flex-direction: column; gap: 0; margin: 12px 0; }
.buoc { position: relative; background: var(--mat); border: 1px solid var(--vien); border-radius: 10px; padding: 10px 12px; }
.buoc + .buoc { margin-top: 28px; }
.buoc + .buoc::before { content: "↓"; position: absolute; top: -26px; left: 18px; font-size: 18px; color: var(--chu2); }
.buoc b { display: block; }
@media (min-width: 1000px) {
  .chuoi { flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: 0; }
  .buoc { flex: 1 1 180px; max-width: 260px; }
  .buoc + .buoc { margin-top: 0; margin-left: 30px; }
  .buoc + .buoc::before { content: "→"; top: 40%; left: -24px; }
}

table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--vien); }
th { font-size: 14px; color: var(--chu2); font-weight: 600; }
.bang-cuon { overflow-x: auto; border: 1px solid var(--vien); border-radius: 10px; background: var(--mat); }
@media (max-width: 700px) {
  table.xep thead { display: none; }
  table.xep tr { display: block; border-top: 1px solid var(--vien); padding: 6px 0; }
  table.xep td { display: block; border: 0; padding: 3px 10px; }
  table.xep td[data-nhan]::before { content: attr(data-nhan) ": "; color: var(--chu2); font-size: 14px; }
}

.thanh { height: 10px; border-radius: 4px; background: var(--nhan); }
.ngan-sach li { grid-template-columns: minmax(0, 1fr) 40px; }
.ngan-sach .thanh-nen { grid-column: 1 / -1; background: var(--mat2); border-radius: 4px; }

.bieu-do { position: relative; }
.bieu-do svg { width: 100%; height: auto; display: block; }
.bieu-do .tip { position: absolute; pointer-events: none; background: var(--chu); color: var(--nen); font-size: 14px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.chua-do { border: 2px dashed var(--vien); border-radius: 12px; padding: 14px; color: var(--chu2); }
.bao { border-radius: 10px; padding: 10px 14px; margin: 12px 0; border-left: 4px solid var(--nhan); background: var(--nhan-nen); }
.bao.vang { border-left-color: var(--vang); background: var(--vang-nen); }
pre { white-space: pre-wrap; word-break: break-word; background: var(--mat2); padding: 10px; border-radius: 8px; font-size: 14px; }
footer { border-top: 1px solid var(--vien); margin-top: 36px; padding: 16px 0 40px; color: var(--chu2); font-size: 15px; }
[hidden] { display: none !important; }
@media print { nav.tab, .hang-nut { display: none; } [role="tabpanel"][hidden] { display: block !important; } }
</style>

<header class="dau">
  <div class="khung">
    <h1>Hệ thống ClinicAI — nhìn từ trên xuống</h1>
    <div class="phu" id="dong-sinh">…</div>

      <span class="cham xanh"><i>✓</i>Ổn</span>

      <span><span class="muc">Mức 2</span> mức việc theo CLAUDE.md (0–3)</span>

    <div class="hang-nut">

      <a class="nut" id="lk-lego" href="../lego/index.html">Bản đồ lego thao tác →</a>
    </div>
    <nav class="tab" role="tablist" aria-label="Các tab">
      <button type="button" role="tab" data-tab="moi-truong">1 · Môi trường &amp; request</button>
      <button type="button" role="tab" data-tab="luong">2 · Lượng request &amp; tài nguyên</button>
      <button type="button" role="tab" data-tab="bao-mat">3 · Bảo mật</button>
      <button type="button" role="tab" data-tab="bang">4 · Bảng điều khiển</button>
      <button type="button" role="tab" data-tab="hang-cho">5 · Có cần Redis / RabbitMQ?</button>
    </nav>
  </div>
</header>

<main class="khung">
  <section role="tabpanel" id="moi-truong" hidden></section>
  <section role="tabpanel" id="luong" hidden></section>
  <section role="tabpanel" id="bao-mat" hidden></section>
  <section role="tabpanel" id="bang" hidden></section>
  <section role="tabpanel" id="hang-cho" hidden></section>
</main>
<footer><div class="khung" id="chan"></div></footer>

      bl("Kết luận ngắn", "<p>" + cham("xanh", "Chưa cần") + "</p><p>Chỗ chậm đo được nằm trong code (dựng lại trang thừa, N+1, worker nghỉ cứng 1 giây) — thêm Redis/RabbitMQ không chữa những thứ đó, chỉ thêm một dịch vụ phải sao lưu, canh, vá. Sửa việc 1–3 rồi đo lại.</p>") + "</div>";
    h += '<h2>Số đo đặt cạnh ngưỡng mở lại (SO-LUAT Phần 7)</h2><div class="bang-cuon"><table class="xep"><thead><tr><th>Đề xuất thường gặp</th><th>Ngưỡng để bàn lại</th><th>Số đo hiện có</th><th>Kết luận</th></tr></thead><tbody>' +
      (H.so_sanh || []).map(function (x) {
        return "<tr><td data-nhan=\"Đề xuất\"><b>" + e(x.luat) + "</b></td><td data-nhan=\"Ngưỡng\">" + e(x.nguong) + "</td><td data-nhan=\"Số đo\">" + e(x.so_do) + "</td><td data-nhan=\"Kết luận\">" + cham(x.mau, x.ket_luan) + "</td></tr>";
      }).join("") + '</tbody></table></div><p class="ma">' + e(H.nguon) + "</p>";
    return h;
  }

  /* ------------------------------------------------ chân trang -------- */
  document.getElementById("chan").innerHTML = "<h3>Chưa phủ</h3><ul>" + (V.chua_phu || []).map(function (x) { return "<li>" + e(x) + "</li>"; }).join("") + "</ul>" +
    "<p>Sinh lại: <code>python3 scripts/he-thong-data.py [--so-do so-do.json]</code> · lời giải thích: <code>docs/he-thong/viet-tay.json</code> · " +
    '<a href="' + e(REPO) + '">kho code</a> · <a href="' + e(V.lego || "../lego/index.html") + '">bản đồ lego</a></p>';

  /* ------------------------------------------------ tab + nút --------- */
  var ve = { "moi-truong": tab1, "luong": tab2, "bao-mat": tab3, "bang": tab4, "hang-cho": tab5 };
  var daVe = {};
  function moTab(id) {
    if (!ve[id]) id = "moi-truong";
    document.querySelectorAll('[role="tab"]').forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === id)); });
    document.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = p.id !== id; });
    if (!daVe[id]) {
      var p = document.getElementById(id);
      try { p.innerHTML = ve[id](); } catch (loi) { p.innerHTML = '<div class="bao vang">Không dựng được tab này: ' + e(loi && loi.message) + "</div>"; }
      daVe[id] = true;
      if (id === "moi-truong") veDuong(0);
      if (id === "bang") veBang(trangBang);
      if (id === "luong" && D.so_do && D.so_do.prod && D.so_do.prod.req_moi_gio) moTip(D.so_do.prod.req_moi_gio);
    }
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest && ev.target.closest("button");
    if (!t) return;
    if (t.getAttribute("role") === "tab") { var id = t.getAttribute("data-tab"); if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); moTab(id); }
    else if (t.classList.contains("chon-duong")) veDuong(+t.getAttribute("data-i"));
    else if (t.classList.contains("chon-bang")) veBang(+t.getAttribute("data-i"));
  });
  function luu(k, v) { try { localStorage.setItem(k, v); } catch (x) { /* trình duyệt chặn lưu: bỏ qua */ } }
  function doc(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
  var nutBl = document.getElementById("nut-bl");
  function datBl(bat) {
    document.body.classList.toggle("an-bl", !bat);
    nutBl.setAttribute("aria-pressed", String(bat));
    nutBl.textContent = "Đề xuất bên lề: " + (bat ? "bật" : "tắt");
  }
  nutBl.addEventListener("click", function () { var bat = nutBl.getAttribute("aria-pressed") !== "true"; datBl(bat); luu("ht-bl", bat ? "1" : "0"); });
  datBl(doc("ht-bl") !== "0");
  var goc = document.documentElement;
  var daLuu = doc("ht-mau");
  if (daLuu === "dark" || daLuu === "light") goc.setAttribute("data-theme", daLuu);
  document.getElementById("nut-mau").addEventListener("click", function () {
    var toi = goc.getAttribute("data-theme") ? goc.getAttribute("data-theme") === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var moi = toi ? "light" : "dark";
    goc.setAttribute("data-theme", moi); luu("ht-mau", moi);
  });
  window.addEventListener("hashchange", function () { moTab(location.hash.slice(1)); });
  moTab(location.hash.slice(1));
})();
</script>
</body>
</html>
