name: CI

# Runs on both deploy branches AND every PR (spec Phase 5: red blocks merge).
on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry 2.4.1
        run: pip install poetry==2.4.1

      - name: Configure Poetry (in-project venv)
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: Ruff lint
        run: poetry run ruff check src/

      - name: Ruff format check
        run: poetry run ruff format --check src/

      - name: Mypy
        run: poetry run mypy src/

      - name: Tenant-scope audit
        # The backend connects as the database owner, so RLS does not apply to
        # it: a query naming a tenant table without clinic_id reads every
        # clinic. This holds the count while it comes down to zero, which is
        # required before a second clinic is onboarded (ADR-0009).
        run: python3 scripts/tests/tenant-scope-audit.py --check

      - name: Pytest with coverage (unit tests only)
        env:
          ANTHROPIC_API_KEY: ""
        run: >-
          poetry run pytest src/tests/ -v --tb=short
          -m "not db and not integration"
          --cov=clinicai --cov-report=term --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard
    env:
      # Dummy public values so `next build` can inline them; real values are set
      # per-environment at deploy time. Skips runtime env validation for the build.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Security boundary tests
        run: npm run test:audit && npm run test:ops && npm run test:boundary

      - name: Build
        run: npm run build

  infra-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Infrastructure safety smoke tests
        run: ./scripts/tests/test-infra-safety.sh

  portability:
    # ADR-0013: the Mac mini is a deployment, not an architecture. Moving to a
    # VPS should be an ops task, so prove on every PR that the images build and
    # boot on linux/amd64 — not on Apple Silicon, and not with Docker Desktop.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: No committed config may name somebody's home directory
        run: |
          # A /Users/... or /home/<someone>/... default is how "works on the Mac
          # mini" quietly becomes "only works on the Mac mini". Relative paths
          # resolve against the compose file and are fine anywhere.
          if grep -rnE '(/Users/|/home/[a-z]+/)' \
               docker-compose.yml Dockerfile.api src/dashboard/Dockerfile.dashboard \
               .env.example .env.prod.example .env.staging.example \
             | grep -v '^\S*: *#'; then
            echo "::error::host-specific path in committed config — see ADR-0013"
            exit 1
          fi

      - name: The compose stack resolves from the shipped example env
        # CLINIC_ENV_FILE is overridden in the shell because the examples point
        # it at .env.prod / .env.staging, which are gitignored secrets that no
        # CI checkout has. Compose reads env_file at config time, so without
        # this the gate can only ever pass on a machine that already holds the
        # secrets — which is the opposite of what it is meant to prove.
        run: |
          for example in .env.prod.example .env.staging.example; do
            echo "-- $example"
            CLINIC_ENV_FILE="$example" \
              docker compose --env-file "$example" config > /dev/null
          done

      - name: Build api for linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          tags: clinicai-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard for linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ./src/dashboard
          file: ./src/dashboard/Dockerfile.dashboard
          platforms: linux/amd64
          tags: clinicai-dashboard:ci
          load: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Images really are amd64
        run: |
          for image in clinicai-api:ci clinicai-dashboard:ci; do
            arch=$(docker image inspect "$image" --format '{{.Architecture}}')
            echo "$image -> $arch"
            [ "$arch" = "amd64" ] || { echo "::error::$image is $arch"; exit 1; }
          done

      - name: api boots and reports the database healthy
        run: |
          # /health/db only runs SELECT 1, so the stock Postgres service answers
          # it. What is being proven is that the image starts and reaches a
          # database on Linux — not anything about Supabase.
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_ANON_KEY=ci-anon-key \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-service-key \
            -e ANTHROPIC_API_KEY=sk-ci-not-a-real-key \
            -e BACKEND_API_KEY=ci-api-key \
            -e CHECKPOINTER_BACKEND=memory \
            clinicai-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health || { docker logs api-smoke; exit 1; }
          echo
          curl -fsS http://localhost:8000/health/db || { docker logs api-smoke; exit 1; }
          echo
          docker rm -f api-smoke

      - name: dashboard boots and answers its liveness probe
        run: |
          docker run -d --name dash-smoke --network host \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key \
            -e CLINIC_API_URL=http://localhost:8000 \
            clinicai-dashboard:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3000/health || { docker logs dash-smoke; exit 1; }
          echo
          docker rm -f dash-smoke

  database:
    # Applies the migration chain to a throwaway Postgres and asserts the schema
    # invariants (tenant isolation, RLS). Never touches a Supabase project.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrations and seed must be plain SQL
        # psql meta-commands (\restrict, COPY ... FROM stdin) are client syntax.
        # psql runs them, the Supabase CLI does not — so a dump-derived file can
        # pass every test here and still make `supabase db push` fail on line 1.
        run: |
          if grep -nE '^\\(un)?restrict|FROM stdin' \
               supabase/migrations/*.sql supabase/seed.sql; then
            echo "::error::psql-only syntax — the Supabase CLI cannot execute it"
            exit 1
          fi

      - name: Supabase auth fixture
        run: $PSQL -f supabase/tests/bootstrap_plain_postgres.sql

      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "-- $migration"
            $PSQL -f "$migration"
          done

      - name: Migrations from 20260730 onward must be re-appliable
        # `db push` retries and restore drills replay migrations, so new ones have
        # to be safe to run twice. Older migrations are already in production and
        # are not edited retroactively.
        run: |
          for migration in supabase/migrations/*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            [ "$version" \< "20260730000000" ] && continue
            $PSQL -f "$migration"
          done

      - name: Schema assertions
        run: |
          for test_file in supabase/tests/*.sql; do
            case "$(basename "$test_file")" in
              bootstrap_plain_postgres.sql) continue ;;
            esac
            echo "-- $test_file"
            $PSQL -f "$test_file"
          done
