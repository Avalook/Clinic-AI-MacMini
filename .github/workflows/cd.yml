name: CD

# Đưa code lên máy chủ sau khi CI xanh. CHẠY TRÊN VPS, không còn dính máy Mac.
#
#   tag staging-*  → staging, TỰ ĐỘNG
#   main           → prod, PHẢI BẤM NÚT, và chỉ chạy trong khung 1h–4h sáng
#
# VÌ SAO HAI ĐƯỜNG KHÁC NHAU. Staging là chỗ để nhìn, sai thì sửa; prod đang đón
# bệnh nhân. Tuyền chốt 13/08/2026: staging tự động cho nhanh, prod thì người
# bấm, và chỉ đổi lúc phòng khám đóng cửa.
#
# MÁY MAC KHÔNG CÒN LIÊN QUAN. Trước đây cả hai môi trường chạy trên Mac mini và
# CD trỏ về `runs-on: [self-hosted, macmini]` — nhưng hệ thống đã sang VPS từ
# 07/08, nên nhãn ấy trỏ vào một cỗ máy không còn nhận việc. Đó là lý do CD nằm
# im suốt (`disabled_manually`) chứ không phải vì có lỗi. Thứ duy nhất còn trỏ
# về Mac là bản sao lưu hằng đêm — và đó là chủ ý: bản sao phải nằm ở máy khác
# với thứ nó sao lưu.

on:
  # Staging: tự động, ngay sau khi CI xanh cho một tag staging-*.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # KHÔNG lọc `branches:` ở đây. Với một lần đẩy TAG, GitHub đặt tên TAG vào
    # `head_branch` — lọc theo nhánh sẽ im lặng bỏ qua mọi lần deploy staging.
    # Ref được kiểm trong điều kiện của job bên dưới, nơi viết rõ được cả hai ca.

  # Prod: người bấm. Không có đường nào khác.
  workflow_dispatch:
    inputs:
      ly_do_vuot_khung_gio:
        description: >-
          Để TRỐNG cho lần deploy bình thường (sẽ bị từ chối ngoài khung 1h–4h
          sáng). Chỉ điền khi thật sự phải vá gấp giữa giờ khám — lý do được ghi
          lại trong log của lần chạy này.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Prod và staging dùng chung một máy Docker. Xếp hàng mọi lần deploy.
  group: clinicai-vps-deploy
  cancel-in-progress: false

jobs:
  # ── STAGING: tự động ───────────────────────────────────────────────────────
  staging:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'staging-')
    # `head_repository` được kiểm riêng vì kho này CÔNG KHAI: ai cũng fork và
    # chạy CI được. Chỉ ref và event thì một lần chạy trong fork người khác cũng
    # thoả điều kiện — và job này chạy trên máy có khoá thật của phòng khám.
    runs-on: [self-hosted, vps]
    steps:
      - name: Từ chối một commit đã bị vượt qua
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          # `workflow_run` có thể tới muộn — CI chạy chậm, một lần chạy lại của
          # bản cũ, hàng đợi dồn. Deploy `head_sha` của nó khi đó là đặt code CŨ
          # đè lên code mới, trông y như hệ thống tự lùi bản và rất khó đoán ra
          # lúc đang có sự cố. So với đầu ref hiện tại rồi bỏ qua thì đúng hơn;
          # commit mới hơn sẽ được chính lần CI của nó đưa lên.
          #
          # DÙNG `curl`, KHÔNG DÙNG `gh`. Runner của GitHub có sẵn `gh`; runner
          # tự quản trên VPS thì không — và lần chạy đầu tiên sau khi cài runner
          # đã đỏ đúng vì thế. Một workflow chạy trên máy mình không được giả
          # định công cụ nào ngoài thứ mình tự cài.
          head_sha=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_REF}" \
                     | sed -n 's/^  "sha": "\([0-9a-f]*\)",$/\1/p' | head -1)
          if [ -z "$head_sha" ]; then
            echo "::error::không đọc được đầu hiện tại của ${SOURCE_REF}"
            exit 1
          fi
          if [ "$head_sha" = "$VERIFIED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bỏ qua ${VERIFIED_SHA}: ${SOURCE_REF} đã chuyển sang ${head_sha}"
          fi

      - name: Lấy đúng commit CI đã kiểm
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          # Mỗi bản phát hành một thư mục riêng, không ghi đè: container đang
          # chạy vẫn gắn vào cây tệp cũ trong lúc bản mới được dựng, nên lùi bản
          # không phụ thuộc vào việc thư mục còn nguyên hay không.
          path: release-staging-${{ github.event.workflow_run.head_sha }}

      - name: Deploy staging
        if: steps.freshness.outputs.deploy == 'true'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Bí mật KHÔNG nằm trong cây mã nguồn. Chúng ở thư mục cố định trên
          # máy chủ và chỉ được truyền vào bằng đường dẫn.
          SECRET_DIR="${CLINIC_DEPLOY_DIR:-/home/clinicai/clinicai}"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-staging-$VERIFIED_SHA"
          test -f "$SECRET_DIR/.env.staging"
          CLINIC_ENV_DIR="$SECRET_DIR" \
          DEPLOY_EXPECTED_SHA="$VERIFIED_SHA" \
          DEPLOY_SOURCE_REF="$SOURCE_REF" \
            "$RELEASE_DIR/scripts/deploy-backend.sh" staging

  # ── PROD: người bấm, và chỉ trong khung 1h–4h sáng ─────────────────────────
  prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, vps]
    steps:
      - name: Kiểm khung giờ được phép đổi prod
        env:
          LY_DO: ${{ inputs.ly_do_vuot_khung_gio }}
        run: |
          set -euo pipefail
          # GIỜ VIỆT NAM, KHÔNG PHẢI GIỜ MÁY CHỦ. Máy chủ chạy giờ quốc tế; "1h
          # sáng" của nó là 8h sáng của phòng khám — đúng giờ đông khách nhất.
          gio=$(TZ=Asia/Ho_Chi_Minh date +%H)
          echo "Giờ Việt Nam hiện tại: ${gio}h"
          if [ "$gio" -ge 1 ] && [ "$gio" -lt 4 ]; then
            echo "Trong khung 1h–4h sáng — cho phép."
            exit 0
          fi
          if [ -n "$LY_DO" ]; then
            # Cửa vượt cho lúc cháy nhà. Không im lặng: lý do vào log của lần
            # chạy, đọc lại được về sau.
            echo "::warning::Deploy prod NGOÀI khung 1h–4h sáng. Lý do: ${LY_DO}"
            exit 0
          fi
          echo "::error::Prod chỉ đổi trong khung 1h–4h sáng (giờ Việt Nam)."
          echo "Đang là ${gio}h. Vá gấp thì chạy lại và điền ô lý do."
          exit 1

      - name: Lấy mã nguồn từ main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false
          path: release-prod-${{ github.sha }}

      - name: Deploy prod
        run: |
          set -euo pipefail
          SECRET_DIR="${CLINIC_DEPLOY_DIR:-/home/clinicai/clinicai}"
          RELEASE_DIR="$GITHUB_WORKSPACE/release-prod-${{ github.sha }}"
          test -f "$SECRET_DIR/.env.prod"
          CLINIC_ENV_DIR="$SECRET_DIR" \
          DEPLOY_SOURCE_REF="main" \
            "$RELEASE_DIR/scripts/deploy-backend.sh" prod
