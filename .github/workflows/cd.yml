name: CD

# Deploy on merge to a deploy branch. Runs on the Mac mini self-hosted runner.
#   main    → prod stack    (Supabase prod)
#   staging → staging stack  (Supabase staging)
# The deploy script does: git pull → build → up → health check → rollback on fail.
on:
  push:
    branches: [main, staging]

concurrency:
  # Never run two deploys of the same environment at once.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Select environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ steps.env.outputs.target }}
        # deploy-backend.sh operates on its OWN fixed clone (which holds the real
        # .env.<target> secrets) — it git-pulls, rebuilds, health-checks, rolls back.
        run: |
          DEPLOY_DIR="${CLINIC_DEPLOY_DIR:-$HOME/Projects/Dr4Women-MacMini}"
          "$DEPLOY_DIR/scripts/deploy-backend.sh" "${{ steps.env.outputs.target }}"
