# Supabase CLI config for ClinicAI / Dr4Women (self-host, Mac mini).
# `project_id` is the LOCAL project name; link a real remote with:
#   supabase link --project-ref <prod-or-staging-ref>
#   supabase db push          # apply migrations/ to the linked project
#   supabase db reset         # (local) recreate DB from migrations/ + seed.sql
project_id = "dr4women-clinic"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# NOTE: there used to be a `[migration] enabled = true` block here. Supabase CLI
# 2.x rejects that key outright — `supabase db reset` fails with "invalid keys:
# migration" before it touches the database, so the block was silently making
# the local workflow unusable. The principle it stood for (no click-ops; every
# schema change is a git-tracked file under migrations/) is enforced by review
# and by supabase/tests/run-local.sh, not by a config flag.
